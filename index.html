/* ===================== v5: main tabs & card lists (memo / knowledge) ===================== */
function applyMainTab(tab){
  mainTab = tab;
  try{ localStorage.setItem('ema_main_tab', tab); }catch(e){}
  document.querySelectorAll('.main-tab').forEach(function(b){ b.classList.toggle('active', b.dataset.mainTab === tab); });
}
function switchMainTab(tab){
  if(tab === mainTab){ renderListView(); return; }
  applyMainTab(tab);
  renderListView();
}
function nodesOfKind(kind){
  return Object.keys(nodesById).map(function(id){ return nodesById[id]; }).filter(function(n){ return n.kind === kind; });
}
function matchesCardSearch(n, q){
  if(!q) return true;
  var hay = [n.title||'', n.note||'', n.learnedFrom||'', n.place||'', (n.tags||[]).join(' ')].join('\n').toLowerCase();
  return q.toLowerCase().split(/\s+/).filter(Boolean).every(function(tok){ return hay.indexOf(tok) !== -1; });
}
function createCardNode(kind){
  var data;
  if(kind === 'memo'){
    var t = new Date(); var p2 = function(x){ return (x<10?'0':'')+x; };
    data = { parentId:null, kind:'memo', type:'learningMemo', title:'', note:'', media:[], relatedIds:[], tags:[], createdAt:Date.now(),
      learnedAt: t.getFullYear() + '-' + p2(t.getMonth()+1) + '-' + p2(t.getDate()), learnedFrom:'', place:'' };
  } else {
    data = { parentId:null, kind:'knowledge', type:'kbOther', title:'', note:'', media:[], relatedIds:[], tags:[], createdAt:Date.now() };
  }
  var id = newId(); data.id = id;
  nodesById[id] = data;
  persistLocalCache();
  return { id: id };
}
function buildCardRow(n){
  var isMemo = n.kind === 'memo';
  var row = el('div','list-row');
  row.style.setProperty('--type-color', 'var(' + (isMemo ? '--accent-memo' : '--accent-kb') + ')');
  var col = el('div','list-row-main');
  var titleRow = el('div','list-row-title-row');
  var badge = el('span','kind-badge ' + (isMemo ? 'kb-memo' : 'kb-knowledge'));
  badge.textContent = isMemo ? 'メモ' : ((TYPE_META[n.type]||TYPE_META.kbOther).label);
  var t = el('span','list-row-title'); t.textContent = n.title || '(無題)';
  titleRow.appendChild(badge); titleRow.appendChild(t);
  col.appendChild(titleRow);
  if(isMemo){
    var metaBits = [n.learnedAt || '', n.learnedFrom ? (n.learnedFrom + ' から') : '', n.place || ''].filter(Boolean);
    if(metaBits.length){
      var ml = el('div','card-meta-line'); ml.textContent = metaBits.join(' ・ ');
      col.appendChild(ml);
    }
  }
  var noteText = (n.note || '').trim();
  if(noteText){
    var ex = el('div','card-excerpt'); ex.textContent = noteText;
    col.appendChild(ex);
  }
  if(n.tags && n.tags.length){
    var tagsRow = el('div','list-row-tags');
    n.tags.forEach(function(tg){ var c = el('span','mini-tag'); c.textContent = '#' + tg; tagsRow.appendChild(c); });
    col.appendChild(tagsRow);
  }
  var relTitles = (n.relatedIds || []).map(function(r){ return nodesById[r]; }).filter(Boolean).map(function(r){ return r.title || '(無題)'; });
  if(relTitles.length){
    var lk = el('div','card-links');
    lk.textContent = '🔗 ' + relTitles.slice(0, 2).join('、') + (relTitles.length > 2 ? (' ほか' + (relTitles.length - 2) + '件') : '');
    col.appendChild(lk);
  }
  row.appendChild(col);
  var side = [];
  if(n.pinned) side.push('📌');
  if(n.media && n.media.length) side.push('📎' + n.media.length);
  if(side.length){ var mm = el('span','list-row-meta'); mm.textContent = side.join(' '); row.appendChild(mm); }
  row.addEventListener('click', function(id){ return function(){ openPanel(id); }; }(n.id));
  return row;
}
function renderCardList(kind){
  var lv = $('#list-view'); if(lv) lv.hidden = true;
  var cv = $('#card-view'); if(cv) cv.hidden = false;
  var isMemo = kind === 'memo';
  var head = $('#card-head'); head.innerHTML = '';
  var all = nodesOfKind(kind);
  var headRow = el('div','card-head-row');
  var ttl = el('span','card-head-title'); ttl.textContent = isMemo ? '学びメモ' : '基礎情報';
  var cnt = el('span','card-head-count'); cnt.textContent = all.length + '件';
  headRow.appendChild(ttl); headRow.appendChild(cnt);
  if(editMode){
    var addBtn = el('button','card-add-btn'); addBtn.type = 'button';
    addBtn.textContent = isMemo ? '＋ メモを追加' : '＋ 基礎を追加';
    addBtn.addEventListener('click', function(){
      var ref = createCardNode(kind);
      renderCardList(kind);
      openPanel(ref.id);
    });
    headRow.appendChild(addBtn);
  }
  head.appendChild(headRow);
  // per-kind tag filter chips
  var counts = {};
  all.forEach(function(n){ (n.tags||[]).forEach(function(t){ counts[t] = (counts[t]||0) + 1; }); });
  var tagList = Object.keys(counts).sort(function(a, b){ if(counts[b] !== counts[a]) return counts[b] - counts[a]; return a.localeCompare(b, 'ja'); });
  if(tagList.length){
    var tagRow = el('div','card-tag-row');
    tagList.forEach(function(tg){
      var active = cardTagFilter[kind].indexOf(tg) !== -1;
      var chip = el('span','chip' + (active ? ' active' : ''));
      chip.textContent = '#' + tg + '（' + counts[tg] + '）';
      chip.addEventListener('click', function(t2){ return function(){
        var arr = cardTagFilter[kind];
        var ix = arr.indexOf(t2);
        if(ix === -1) arr.push(t2); else arr.splice(ix, 1);
        renderCardList(kind);
      }; }(tg));
      tagRow.appendChild(chip);
    });
    head.appendChild(tagRow);
  }
  var itemsWrap = $('#card-items'); itemsWrap.innerHTML = '';
  var results = all
    .filter(function(n){ return matchesCardSearch(n, searchQuery); })
    .filter(function(n){
      if(!cardTagFilter[kind].length) return true;
      var tags = n.tags || [];
      return cardTagFilter[kind].every(function(t){ return tags.indexOf(t) !== -1; });
    })
    .sort(function(a, b){
      if(!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
      if(isMemo){
        var da = a.learnedAt || '', db = b.learnedAt || '';
        if(db !== da) return db < da ? -1 : 1;
      }
      return (b.createdAt||0) - (a.createdAt||0);
    });
  if(!results.length){
    var e = el('div','list-empty-hint');
    e.textContent = all.length ? '一致する項目がありません。' : (isMemo ? 'まだ学びメモがありません。チャットで投げてもらえればカード化します。' : 'まだ基礎情報がありません。');
    itemsWrap.appendChild(e);
    return;
  }
  results.forEach(function(n){ itemsWrap.appendChild(buildCardRow(n)); });
}

/* ===================== v5: link map (radial SVG) ===================== */
function kindColorVar(n){
  if(n.kind === 'memo') return '--accent-memo';
  if(n.kind === 'knowledge') return '--accent-kb';
  return (typeMetaOf(n) || TYPE_META.note).cssVar;
}
function buildLinkMapGroup(node){
  var rel = (node.relatedIds || []).map(function(r){ return nodesById[r]; }).filter(Boolean);
  if(!rel.length) return null;
  var group = el('div','field-group');
  group.appendChild(labelEl('リンクマップ'));
  var wrap = el('div','link-map-wrap');
  var NS = 'http://www.w3.org/2000/svg';
  var W = 340, H = 300, cx = W/2, cy = H/2, R = 110;
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('width', '340'); svg.setAttribute('height', '300');
  var lineCol = cssColor('--line') || '#3A3A36';
  var inkCol = cssColor('--ink') || '#ECEAE2';
  var softCol = cssColor('--ink-soft') || '#A3A099';
  var shown = rel.slice(0, 12);
  var pts = shown.map(function(rn, i){
    var ang = (Math.PI * 2 * i) / shown.length - Math.PI / 2;
    return { n: rn, x: cx + R * Math.cos(ang), y: cy + R * Math.sin(ang) * 0.8 };
  });
  pts.forEach(function(p){
    var line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', cx); line.setAttribute('y1', cy);
    line.setAttribute('x2', p.x); line.setAttribute('y2', p.y);
    line.setAttribute('stroke', lineCol); line.setAttribute('stroke-width', '1');
    svg.appendChild(line);
  });
  function satNode(x, y, rn, r, isCenter){
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'link-map-node');
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r);
    c.setAttribute('fill', cssColor(kindColorVar(rn)));
    g.appendChild(c);
    var tx = document.createElementNS(NS, 'text');
    tx.setAttribute('x', x); tx.setAttribute('y', y + r + 13);
    tx.setAttribute('text-anchor', 'middle');
    tx.setAttribute('font-size', isCenter ? '11' : '10');
    tx.setAttribute('font-weight', isCenter ? '700' : '400');
    tx.setAttribute('fill', isCenter ? inkCol : softCol);
    tx.textContent = (rn.title || '(無題)').substring(0, isCenter ? 12 : 8);
    g.appendChild(tx);
    if(!isCenter){
      g.addEventListener('click', function(id){ return function(){ openPanel(id); }; }(rn.id));
    }
    svg.appendChild(g);
  }
  pts.forEach(function(p){ satNode(p.x, p.y, p.n, 15, false); });
  satNode(cx, cy, node, 24, true);
  wrap.appendChild(svg);
  group.appendChild(wrap);
  var cap = el('div','link-map-caption');
  cap.textContent = 'タップで移動できます' + (rel.length > shown.length ? ('（ほか ' + (rel.length - shown.length) + ' 件は下の関連リストに表示）') : '');
  group.appendChild(cap);
  return group;
}

    var lbl2 = el('span'); lbl2.textContent = rn.title || '(無題)';
    chip.appendChild(lbl2);
    if(editMode){
      var x2 = el('button','chip-x'); x2.textContent = '✕';
      x2.addEventListener('click', function(rr){ return function(ev){ ev.stopPropagation(); removeRelation(node.id, rr); }; }(rn.id));
      chip.appendChild(x2);
    }
    chip.addEventListener('click', function(rr){ return function(){ openPanel(rr); }; }(rn.id));
    relRow.appendChild(chip);
  });
  if(editMode){
    var addChip = el('button','chip-add'); addChip.type = 'button'; addChip.textContent = '＋ 追加';
    addChip.addEventListener('click', function(){ openPicker(node.id, null, null); });
    relRow.appendChild(addChip);
  }
  relGroup.appendChild(relRow);
  if(!editMode && !relNodes.length){
    var noneNote = el('div','root-note'); noneNote.textContent = '関連はまだありません。';
    relGroup.appendChild(noneNote);
  }
  body.appendChild(relGroup);

  // link map
  var lm = buildLinkMapGroup(node);
  if(lm) body.appendChild(lm);

  // related candidates across kinds (shared tags)
  var myTags = node.tags || [];
  if(myTags.length){
    var relSet = {};
    (node.relatedIds || []).forEach(function(r){ relSet[r] = true; });
    var cands = Object.keys(nodesById).map(function(id){ return nodesById[id]; })
      .filter(function(n){ return (n.kind === 'content' || n.kind === 'memo' || n.kind === 'knowledge') && n.id !== node.id && !relSet[n.id]; })
      .map(function(n){
        var shared = (n.tags || []).filter(function(t){ return myTags.indexOf(t) !== -1; });
        return { node: n, shared: shared };
      })
      .filter(function(c){ return c.shared.length > 0; })
      .sort(function(a, b){
        if(b.shared.length !== a.shared.length) return b.shared.length - a.shared.length;
        return (a.node.title || '').localeCompare(b.node.title || '', 'ja');
      })
      .slice(0, 5);
    if(cands.length){
      var candGroup = el('div','field-group');
      candGroup.appendChild(labelEl('関連候補（タグが重なるページ）'));
      cands.forEach(function(c){
        var row = el('div','chip-row'); row.style.marginBottom = '6px';
        var chip = el('span','chip');
        var dot2 = el('span'); dot2.style.cssText = 'width:7px;height:7px;border-radius:50%;background:' + cssColor(kindColorVar(c.node)) + ';display:inline-block;';
        chip.appendChild(dot2);
        var clbl = el('span'); clbl.textContent = c.node.title || '(無題)';
        chip.appendChild(clbl);
        chip.addEventListener('click', function(cid){ return function(){ openPanel(cid); }; }(c.node.id));
        row.appendChild(chip);
        var tagNote = el('span');
        tagNote.style.cssText = 'font-size:11px;color:var(--ink-soft);align-self:center;';
        tagNote.textContent = '共通タグ: ' + c.shared.map(function(t){ return '#' + t; }).join(' ');
        row.appendChild(tagNote);
        if(editMode){
          var addBtn = el('button','chip-add'); addBtn.type = 'button'; addBtn.textContent = '関連に追加';
          addBtn.addEventListener('click', function(cid){ return function(){
            addRelation(node.id, cid);
            renderPanelContent(nodesById[node.id]);
            renderListView();
            showToast('関連に追加しました');
          }; }(c.node.id));
          row.appendChild(addBtn);
        }
        candGroup.appendChild(row);
      });
      body.appendChild(candGroup);
    }
  }

  // done
  var doneBtn = el('button','done-btn'); doneBtn.type = 'button';
  doneBtn.textContent = editMode ? '✓ 完了（保存して閉じる）' : '閉じる';
  doneBtn.addEventListener('click', function(){ closePanel(); });
  body.appendChild(doneBtn);

  // delete
  if(editMode){
    var dz = el('div','danger-zone');
    var delBtn = el('button','delete-btn'); delBtn.type = 'button';
    delBtn.textContent = 'このノードを削除';
    delBtn.addEventListener('click', function(){
      if(confirm('本当に削除しますか？この操作は取り消せません。')){ deleteNode(node.id); }
    });
    dz.appendChild(delBtn);
    body.appendChild(dz);
  }
}

function openRelOverview(){
  var list = $('#rel-overview-list');
  list.innerHTML = '';
  var seen = {};
  var pairs = [];
  Object.keys(nodesById).forEach(function(id){
    var n = nodesById[id];
    (n.relatedIds||[]).forEach(function(rid){
      var key = [id, rid].sort().join('|');
      if(seen[key]) return; seen[key] = true;
      var other = nodesById[rid];
      if(!other) return;
      pairs.push([n, other]);
    });
  });
  if(!pairs.length){
    var e = el('div','list-empty-hint');
    e.textContent = 'まだ関連付けされたノードがありません。各ページの「関連ノード」欄から追加できます。';
    list.appendChild(e);
  } else {
    pairs.forEach(function(pair){
      var row = el('div','rel-pair');
      pair.forEach(function(n, i){
        if(i === 1){
          var link = el('div','rel-pair-link'); link.textContent = '🔗';
          row.appendChild(link);
        }
        var meta = typeMetaOfSafe(n);
        var side = el('div','rel-pair-side');
        var dot = el('span','dot'); dot.style.background = cssColor(meta.cssVar);
        var textWrap = el('div');
        var title = el('div','rp-title'); title.textContent = n.title || '(無題)';
        var crumb = el('div','rp-crumb'); crumb.textContent = fullBreadcrumb(n);
        textWrap.appendChild(title); textWrap.appendChild(crumb);
        side.appendChild(dot); side.appendChild(textWrap);
        side.addEventListener('click', function(nid){
          return function(){ closeRelOverview(); openPanel(nid); };
        }(n.id));
        row.appendChild(side);
      });
      list.appendChild(row);
    });
  }
  $('#rel-overview').classList.add('show');
  $('#backdrop-rel').classList.add('show');
}
function closeRelOverview(){
  $('#rel-overview').classList.remove('show');
  $('#backdrop-rel').classList.remove('show');
}
function typeMetaOfSafe(n){
  if(n.kind === 'category') return { cssVar: CATEGORY_CSS_VAR };
  return TYPE_META[n.type] || TYPE_META.note;
}

function buildDiagText(){
  var lsRaw = null;
  try{ lsRaw = localStorage.getItem(LOCAL_CACHE_KEY); }catch(e){ lsRaw = 'read-error: ' + e; }
  var lines = [
    'localStorage自己テスト: ' + LS_TEST,
    'location.href: ' + location.href,
    '現在保存されているノード数: ' + Object.keys(nodesById).length,
    '未同期の変更ノード数: ' + dirtyNodeIds.size,
    '保存先: ' + (storageBackend === 'idb' ? 'IndexedDB (ema_atlas_db)' : 'localStorage'),
    '保存先の状態: ' + storageStatus,
    'localStorage旧キャッシュの有無: ' + (lsRaw ? ('あり (' + lsRaw.length + '文字)') : 'なし'),
    'UserAgent: ' + navigator.userAgent
  ];
  return lines.join('\n');
}

    dirtyNodeIds.forEach(function(id){
      if(nodesById[id]){ out[id] = nodesById[id]; n++; }
    });

  });

  /* 差分をファイルで書き出し: 未同期ノードだけをファイル化し、dirty をクリアする */
  $('#diag-diff-file-export').addEventListener('click', function(){
    var out = {};
    var n = 0;
    dirtyNodeIds.forEach(function(id){
      if(nodesById[id]){ out[id] = nodesById[id]; n++; }
    });
    if(!n){
      dirtyNodeIds.clear(); saveDirtySet(); updateDirtyExportLabel();
      showToast('未同期の変更はありません');
      return;
    }
    downloadJsonFile(out, 'atlas-diff-' + atlasDateStamp() + '.json');
    dirtyNodeIds.clear();
    saveDirtySet();
    updateDirtyExportLabel();
    showToast('差分をファイルに書き出しました（' + n + '件）。もう一方の端末で「ファイルから読み込み」から取り込んでください');
  });

  /* ファイルから読み込み: 選択したJSONファイルを貼り付け取り込みと同じマージで取り込む */

  $('#diag-import-file').addEventListener('click', function(){
    importFileInput.click();
  });
  importFileInput.addEventListener('change', function(){
    var file = importFileInput.files && importFileInput.files[0];
    importFileInput.value = ''; // 同じファイルを連続で選んでも change が発火するようリセット
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var obj = JSON.parse(String(reader.result || ''));
        if(!obj || typeof obj !== 'object' || Array.isArray(obj)) throw new Error('invalid');
        mergeImportedNodes(obj);
      }catch(e){
        showToast('復元に失敗しました。ファイルの形式を確認してください');
      }
    };
    reader.onerror = function(){ showToast('ファイルの読み込みに失敗しました'); };
    reader.readAsText(file);
  });

  $('#diag-import').addEventListener('click', function(){
    inlinePrompt('バックアップのテキストを貼り付けてください（貼り付けると今のデータに上書き・追加されます）', '', function(pasted){
      pasted = (pasted||'').trim();
      if(!pasted) return;
      try{
        var obj = JSON.parse(pasted);
        if(!obj || typeof obj !== 'object') throw new Error('invalid');
        mergeImportedNodes(obj);
      }catch(e){
        showToast('復元に失敗しました。テキストの形式を確認してください');
      }
    }, { multiline: true });
  });
}

/* ===================== Google Drive 自動同期 (v6) =====================
   端末間同期: Google Drive の appDataFolder（アプリ専用の隠し領域）に
   全ノードを1ファイルで置き、編集したら自動で上げ、起動時と再表示時に
   取り込んで id 単位でマージする。
   競合ルール: 最後に同期した状態（base）と比べてローカルで変わっている
   ノードはローカル優先、それ以外はリモート優先。削除は伝播しない
   （従来の差分書き出しと同じ制限）。
   base は IndexedDB の 'driveBase' キーに保存する（使えない環境では
   メモリ上のみ＋未同期集合 dirtyNodeIds にフォールバックする）。 */
var DRIVE_CLIENT_ID = '671563290673-bf385gd30gmej5ak42k8u2a2hhvbopnm.apps.googleusercontent.com';
var DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
var DRIVE_FILE_NAME = 'atlas-sync.json';
var DRIVE_LINK_KEY = 'ema_drive_linked';
var DRIVE_DEVICE_KEY = 'ema_device_id';
var driveLinked = false;
try{ driveLinked = localStorage.getItem(DRIVE_LINK_KEY) === '1'; }catch(e){}
var driveDeviceId = (function(){
  try{
    var d = localStorage.getItem(DRIVE_DEVICE_KEY);
    if(!d){ d = 'dev-' + Math.random().toString(36).slice(2, 10); localStorage.setItem(DRIVE_DEVICE_KEY, d); }
    return d;
  }catch(e){ return 'dev-unknown'; }
})();
var driveToken = null;         // {accessToken, expiresAt}
var driveTokenClient = null;
var driveTokenWaiters = [];
var driveFileId = null;
var driveBase = {};            // id -> JSON文字列（最後に同期した状態）
var driveBaseLoaded = false;
var driveLastRemoteUpdatedAt = 0;
var driveLastUploadAt = 0;
var driveLastPullAt = 0;
var driveUploadTimer = null;
var driveSyncBusy = false;

function driveTimeStr(ms){
  var d = new Date(ms);
  function p2(n){ return (n < 10 ? '0' : '') + n; }
  return p2(d.getHours()) + ':' + p2(d.getMinutes());
}
function driveSetStatus(text){
  var el = document.getElementById('drive-sync-status');
  if(el) el.textContent = text;
}
function driveRenderSyncUI(){
  var linkBtn = document.getElementById('drive-link-btn');
  var syncBtn = document.getElementById('drive-sync-btn');
  var unlinkBtn = document.getElementById('drive-unlink-btn');
  if(linkBtn) linkBtn.style.display = driveLinked ? 'none' : '';
  if(syncBtn) syncBtn.style.display = driveLinked ? '' : 'none';
  if(unlinkBtn) unlinkBtn.style.display = driveLinked ? '' : 'none';
  if(!driveLinked) driveSetStatus('未連携（この端末のデータは自動同期されません）');
}
function driveNodeJson(id){
  try{ return nodesById[id] ? JSON.stringify(nodesById[id]) : null; }catch(e){ return null; }
}
function driveIsLocalChanged(id){
  if(driveBaseLoaded) return driveBase[id] !== driveNodeJson(id);
  return dirtyNodeIds.has(id);
}
function driveHasChanges(){
  var ids = Object.keys(nodesById);
  for(var i = 0; i < ids.length; i++){ if(driveIsLocalChanged(ids[i])) return true; }
  return false;
}
function driveSnapshotCurrent(){
  var snap = {};
  Object.keys(nodesById).forEach(function(id){ snap[id] = driveNodeJson(id); });
  return snap;
}
function driveBaseSave(){
  if(storageBackend === 'idb' && idbDb){
    idbPut(idbDb, 'driveBase', driveBase).catch(function(){});
  }
}
function driveBaseLoad(done){
  if(storageBackend === 'idb' && idbDb){
    idbGet(idbDb, 'driveBase').then(function(stored){
      if(stored && typeof stored === 'object'){ driveBase = stored; driveBaseLoaded = true; }
      done();
    }).catch(function(){ done(); });
  } else { done(); } // base が読めない環境では未同期集合（dirtyNodeIds）で判定する
}
/* ---- 認証（Google Identity Services） ---- */
function driveLoadGis(cb){
  if(window.google && google.accounts && google.accounts.oauth2){ cb(true); return; }
  var s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.async = true; s.defer = true;
  s.onload = function(){ cb(true); };
  s.onerror = function(){ cb(false); };
  document.head.appendChild(s);
}
function driveEnsureClient(){
  if(driveTokenClient) return driveTokenClient;
  driveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: function(resp){
      var ws = driveTokenWaiters; driveTokenWaiters = [];
      if(resp && resp.access_token){
        driveToken = { accessToken: resp.access_token, expiresAt: Date.now() + (resp.expires_in ? resp.expires_in * 1000 : 3600000) };
        ws.forEach(function(f){ f(driveToken.accessToken); });
      } else {
        ws.forEach(function(f){ f(null); });
      }
    },
    error_callback: function(){
      var ws = driveTokenWaiters; driveTokenWaiters = [];
      ws.forEach(function(f){ f(null); });
    }
  });
  return driveTokenClient;
}
function driveGetToken(interactive, done){
  if(driveToken && driveToken.expiresAt > Date.now() + 30000){ done(driveToken.accessToken); return; }
  driveTokenWaiters.push(done);
  if(driveTokenWaiters.length > 1) return;
  driveLoadGis(function(ok){
    if(!ok){
      var ws = driveTokenWaiters; driveTokenWaiters = [];
      ws.forEach(function(f){ f(null); });
      return;
    }
    try{ driveEnsureClient().requestAccessToken({ prompt: interactive ? 'consent' : '' }); }
    catch(e){
      var ws2 = driveTokenWaiters; driveTokenWaiters = [];
      ws2.forEach(function(f){ f(null); });
    }
  });
}
/* ---- Drive API ---- */
function driveApi(token, url, options){
  options = options || {};
  options.headers = options.headers || {};
  options.headers['Authorization'] = 'Bearer ' + token;
  return fetch(url, options).then(function(res){
    if(res.status === 401){ driveToken = null; throw new Error('認証の期限切れ'); }
    if(!res.ok) throw new Error('Drive応答 ' + res.status);
    return res;
  });
}
function driveFindFile(token){
  var url = 'https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=' +
    encodeURIComponent('files(id,name,modifiedTime)') + '&q=' + encodeURIComponent("name = '" + DRIVE_FILE_NAME + "'");
  return driveApi(token, url).then(function(r){ return r.json(); }).then(function(j){
    var f = (j.files || [])[0];
    driveFileId = f ? f.id : null;
    return driveFileId;
  });
}
/* ---- 取り込み（pull） ---- */
function driveApplyRemote(remote){
  if(!remote || !remote.nodes || typeof remote.updatedAt !== 'number') return 0;
  if(remote.updatedAt <= driveLastRemoteUpdatedAt) return 0;
  driveLastRemoteUpdatedAt = remote.updatedAt;
  var changed = 0;
  Object.keys(remote.nodes).forEach(function(id){
    if(driveIsLocalChanged(id)) return; // ローカル変更はローカル優先
    var rj = null;
    try{ rj = JSON.stringify(remote.nodes[id]); }catch(e){ return; }
    if(rj !== driveNodeJson(id)){ nodesById[id] = remote.nodes[id]; changed++; }
  });
  // base は「リモートの状態」に合わせる（ローカル変更分はリモート側の値が base）
  Object.keys(remote.nodes).forEach(function(id){
    try{ driveBase[id] = JSON.stringify(remote.nodes[id]); }catch(e){}
  });
  driveBaseLoaded = true;
  driveBaseSave();
  if(changed > 0){
    nodeSnapshot = driveSnapshotCurrent();
    persistLocalCache();
    renderListView();
    if(selectedId && nodesById[selectedId]) renderPanelContent(nodesById[selectedId]);
    showToast('ドライブから同期しました（' + changed + '件）');
  }
  driveScheduleUpload(); // ローカル変更が残っていれば、取り込み後に続けて上げる
  return changed;
}
function drivePull(){
  if(!driveLinked || driveSyncBusy) return;
  driveSyncBusy = true; driveLastPullAt = Date.now();
  driveSetStatus('同期中…');
  driveGetToken(false, function(token){
    if(!token){ driveSyncBusy = false; driveSetStatus('再連携が必要です（下の「ドライブと連携する」を押し直してください）'); driveRenderSyncUI(); return; }
    driveFindFile(token).then(function(fid){
      if(!fid){
        driveSyncBusy = false;
        driveSetStatus('連携済み（ドライブ側にファイルなし。編集すると自動で作られます）');
        if(driveHasChanges()) driveUpload(true);
        return null;
      }
      return driveApi(token, 'https://www.googleapis.com/drive/v3/files/' + fid + '?alt=media')
        .then(function(r){ return r.json(); })
        .then(function(remote){
          driveSyncBusy = false;
          var n = driveApplyRemote(remote);
          if(n === 0) driveSetStatus('連携済み（最新です）');
          else driveSetStatus('連携済み（最終同期 ' + driveTimeStr(Date.now()) + '）');
        });
    }).catch(function(e){
      driveSyncBusy = false;
      driveSetStatus('同期エラー: ' + (e && e.message ? e.message : e));
    });
  });
}
/* ---- 送信（upload） ---- */
function driveScheduleUpload(){
  if(!driveLinked) return;
  if(driveUploadTimer) clearTimeout(driveUploadTimer);
  driveUploadTimer = setTimeout(function(){ driveUploadTimer = null; driveUpload(false); }, 8000);
}
function driveUpload(force){
  if(!driveLinked || driveSyncBusy) return;
  if(!force && !driveHasChanges()) return;
  var nowMs = Date.now();
  if(!force && nowMs - driveLastUploadAt < 20000){
    if(!driveUploadTimer){
      driveUploadTimer = setTimeout(function(){ driveUploadTimer = null; driveUpload(false); }, 20000 - (nowMs - driveLastUploadAt));
    }
    return;
  }
  driveSyncBusy = true;
  driveSetStatus('同期中…');
  driveGetToken(false, function(token){
    if(!token){ driveSyncBusy = false; driveSetStatus('再連携が必要です（下の「ドライブと連携する」を押し直してください）'); return; }
    var payload = { app: 'ema-atlas', kind: 'drive-sync', version: 1, updatedAt: Date.now(), deviceId: driveDeviceId, nodes: nodesById };
    var body = JSON.stringify(payload);
    var uploaded = driveSnapshotCurrent();
    driveFindFile(token).then(function(fid){
      if(fid){
        return driveApi(token, 'https://www.googleapis.com/upload/drive/v3/files/' + fid + '?uploadType=media',
          { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: body });
      }
      var form = new FormData();
      form.append('metadata', new Blob([JSON.stringify({ name: DRIVE_FILE_NAME, parents: ['appDataFolder'] })], { type: 'application/json' }));
      form.append('file', new Blob([body], { type: 'application/json' }));
      return driveApi(token, 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
        { method: 'POST', body: form });
    }).then(function(){
      driveSyncBusy = false;
      driveLastUploadAt = Date.now();
      driveLastRemoteUpdatedAt = payload.updatedAt;
      driveBase = uploaded; driveBaseLoaded = true; driveBaseSave();
      Object.keys(uploaded).forEach(function(id){
        if(driveNodeJson(id) === uploaded[id]) dirtyNodeIds.delete(id);
      });
      saveDirtySet(); updateDirtyExportLabel();
      driveSetStatus('連携済み（最終同期 ' + driveTimeStr(driveLastUploadAt) + '）');
    }).catch(function(e){
      driveSyncBusy = false;
      driveSetStatus('アップロード失敗: ' + (e && e.message ? e.message : e));
    });
  });
}
/* ---- UI と起動 ---- */
function driveBindSyncUI(){
  var linkBtn = document.getElementById('drive-link-btn');
  var syncBtn = document.getElementById('drive-sync-btn');
  var unlinkBtn = document.getElementById('drive-unlink-btn');
  if(linkBtn) linkBtn.addEventListener('click', function(){
    driveSetStatus('Googleに接続しています…');
    driveGetToken(true, function(token){
      if(!token){ driveSetStatus('連携できませんでした。もう一度お試しください'); return; }
      driveLinked = true;
      try{ localStorage.setItem(DRIVE_LINK_KEY, '1'); }catch(e){}
      driveRenderSyncUI();
      driveFindFile(token).then(function(fid){
        if(fid) drivePull();
        else driveUpload(true);
      }).catch(function(){ driveUpload(true); });
    });
  });
  if(syncBtn) syncBtn.addEventListener('click', function(){ drivePull(); driveUpload(false); });
  if(unlinkBtn) unlinkBtn.addEventListener('click', function(){
    driveLinked = false; driveToken = null;
    try{ localStorage.removeItem(DRIVE_LINK_KEY); }catch(e){}
    driveRenderSyncUI();
    showToast('ドライブ連携を切りました（ドライブ側のファイルは残っています）');
  });
}
(function driveBoot(){
  var tries = 0;
  var iv = setInterval(function(){
    tries++;
    if(!storageBooting || tries > 40){
      clearInterval(iv);
      driveRenderSyncUI(); driveBindSyncUI();
      if(driveLinked) driveBaseLoad(function(){ drivePull(); });
    }
  }, 500);
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden && driveLinked && Date.now() - driveLastPullAt > 60000) drivePull();
  });
})();
/* テスト・診断用フック */
window.__emaDriveSync = {
  pull: drivePull,
  upload: function(){ driveUpload(true); },
  state: function(){ return { linked: driveLinked, fileId: driveFileId, lastRemote: driveLastRemoteUpdatedAt, baseLoaded: driveBaseLoaded, busy: driveSyncBusy }; }
};

bootstrapStorage();
})();
</script>
