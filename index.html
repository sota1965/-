<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>アスリートケア・ナレッジアトラス</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Shippori+Mincho+B1:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --font-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Hiragino Sans',Meiryo,sans-serif;
  --font-display:'Shippori Mincho B1','Hiragino Mincho ProN','Yu Mincho',serif;

  --bg:#111110;
  --bg-canvas:#0C0C0C;
  --grid-dot:#2B2B28;
  --ink:#ECEAE2;
  --ink-soft:#A3A099;
  --line:#3A3A36;
  --panel-bg:#171716;
  --card-bg:#1B1B1A;
  --shadow:0 0 0 rgba(0,0,0,0);

  --accent-movement:#D8402F;
  --accent-movement-good:#D8402F;
  --accent-movement-error:#D8402F;
  --accent-cause:#D8402F;
  --accent-effect:#D8402F;
  --accent-correction:#D8402F;
  --accent-anatomy:#D8402F;
  --accent-physiology:#D8402F;
  --accent-note:#D8402F;
  --accent-category:#D8402F;
  --accent-training:#D8402F;
  --accent-treatment:#D8402F;
  --accent-memo:#6EA8FF;
  --accent-kb:#5FC98B;

  --danger:#D8402F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181A;
    --bg-canvas:#191E1C;
    --grid-dot:#2A322D;
    --ink:#E7EAE2;
    --ink-soft:#AEB6AC;
    --line:#3A423C;
    --panel-bg:#1B2120;
    --card-bg:#202624;
    --shadow:0 2px 14px rgba(0,0,0,0.45);

    --accent-movement:#7196C9;
    --accent-movement-good:#4FAE72;
    --accent-movement-error:#E0685A;
    --accent-cause:#E08A5E;
    --accent-correction:#5FBFA4;
    --accent-effect:#D4AD5C;
    --accent-anatomy:#DE8792;
    --accent-physiology:#A794E0;
    --accent-note:#B3AA8E;
    --accent-category:#9AA3AC;
    --accent-training:#5FAF63;
    --accent-treatment:#5B9BC4;
    --accent-memo:#6EA8FF;
    --accent-kb:#5FC98B;
  }
}
:root[data-theme="dark"]{
  --bg:#14181A;
  --bg-canvas:#191E1C;
  --grid-dot:#2A322D;
  --ink:#E7EAE2;
  --ink-soft:#AEB6AC;
  --line:#3A423C;
  --panel-bg:#1B2120;
  --card-bg:#202624;
  --shadow:0 2px 14px rgba(0,0,0,0.45);

  --accent-movement:#7196C9;
  --accent-movement-good:#4FAE72;
  --accent-movement-error:#E0685A;
  --accent-cause:#E08A5E;
  --accent-correction:#5FBFA4;
  --accent-effect:#D4AD5C;
  --accent-anatomy:#DE8792;
  --accent-physiology:#A794E0;
  --accent-note:#B3AA8E;
  --accent-category:#9AA3AC;
  --accent-training:#5FAF63;
  --accent-treatment:#5B9BC4;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  overscroll-behavior:none;
}
button{font-family:inherit;}
#gate-overlay{
  position:fixed;inset:0;z-index:100;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:24px;
}
#gate-overlay.hide{display:none;}
.gate-box{
  width:100%;max-width:320px;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.gate-mark{
  font-family:var(--font-display);font-weight:700;font-size:28px;
  width:56px;height:56px;border-radius:50%;
  border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:6px;
}
.gate-title{font-family:var(--font-display);font-size:18px;font-weight:700;}
.gate-sub{font-size:13px;color:var(--ink-soft);margin-bottom:8px;}
#gate-input{
  width:100%;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--card-bg);color:var(--ink);
  font-size:15px;text-align:center;
}
#gate-btn{
  width:100%;padding:12px;border-radius:10px;border:none;
  background:var(--ink);color:var(--bg);
  font-size:14.5px;font-weight:700;cursor:pointer;
}
.gate-error{color:var(--danger);font-size:12.5px;}

#app{
  height:100vh;
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ---------- topbar ---------- */
#topbar{
  flex:0 0 auto;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  background:var(--panel-bg);
  border-bottom:1px solid var(--line);
  z-index:20;
  flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:8px;min-width:0;}
.brand-mark{
  font-family:var(--font-display);
  font-weight:700;
  font-size:20px;
  width:32px;height:32px;
  border-radius:50%;
  border:1.5px solid var(--ink);
  display:flex;align-items:center;justify-content:center;
  flex:0 0 auto;
}
.brand h1{
  font-family:var(--font-display);
  font-size:16px;
  font-weight:700;
  margin:0;
  letter-spacing:.02em;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.view-tabs{display:flex;gap:2px;flex:0 0 auto;background:var(--bg-canvas);border-radius:999px;padding:2px;}
.view-tab{
  border:none;background:transparent;color:var(--ink-soft);
  padding:6px 13px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;
}
.view-tab.active{background:var(--card-bg);color:var(--ink);box-shadow:var(--shadow);}

.filters{display:flex;gap:6px;flex:0 0 auto;}
.filter-pill{
  border:1px solid var(--line);
  background:transparent;
  color:var(--ink-soft);
  padding:6px 12px;
  border-radius:999px;
  font-size:13px;
  cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
  white-space:nowrap;
}
.filter-pill.active{
  background:var(--ink);
  color:var(--bg);
  border-color:var(--ink);
}
.search-wrap{flex:1 1 160px;min-width:120px;}

.rel-overview-btn{
  flex:0 0 auto;
  border:1px solid var(--line);background:var(--card-bg);color:var(--ink);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;
  white-space:nowrap;
}
.edit-mode-btn{
  flex:0 0 auto;
  border:1px solid var(--line);background:var(--card-bg);color:var(--ink);
  padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;cursor:pointer;
  white-space:nowrap;
}
.edit-mode-btn.view-mode{
  background:var(--ink);color:var(--bg);border-color:var(--ink);
}
#backdrop-rel{
  position:fixed;inset:0;z-index:35;background:rgba(20,24,22,.4);display:none;
}
#backdrop-rel.show{display:block;}
#rel-overview{
  position:fixed;inset:0;z-index:36;
  display:none;align-items:center;justify-content:center;padding:16px;
}
#rel-overview.show{display:flex;}
.rel-overview-box{
  background:var(--panel-bg);border-radius:14px;
  width:100%;max-width:460px;max-height:78vh;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow);
}
.rel-overview-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;
}
.rel-overview-head button{border:none;background:transparent;font-size:18px;color:var(--ink-soft);cursor:pointer;}
.rel-overview-list{overflow-y:auto;padding:10px 14px;}
.rel-pair{
  padding:11px 0;border-bottom:1px solid var(--line);
  display:flex;flex-direction:column;gap:6px;
}
.rel-pair:last-child{border-bottom:none;}
.rel-pair-side{
  display:flex;align-items:center;gap:7px;cursor:pointer;
  padding:6px 8px;border-radius:8px;
}
.rel-pair-side:hover{background:var(--bg-canvas);}
.rel-pair-side .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
.rel-pair-side .rp-title{font-size:13.5px;font-weight:600;}
.rel-pair-side .rp-crumb{font-size:10.5px;color:var(--ink-soft);}
.rel-pair-link{font-size:11px;color:var(--ink-soft);text-align:center;}
#search-input{
  width:100%;
  padding:7px 12px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--card-bg);
  color:var(--ink);
  font-size:14px;
}
#search-input:focus{outline:2px solid var(--accent-movement);outline-offset:1px;}

/* ---------- canvas ---------- */
#canvas-viewport{
  position:relative;
  flex:1 1 auto;
  overflow:hidden;
  background-color:var(--bg-canvas);
  background-image:radial-gradient(var(--grid-dot) 1.3px, transparent 1.3px);
  background-size:26px 26px;
  touch-action:none;
  cursor:grab;
}
#canvas-viewport.dragging{cursor:grabbing;}
#canvas-world{
  position:absolute;
  left:0;top:0;
  transform-origin:0 0;
  will-change:transform;
}
#edge-svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;}
.edge-line{fill:none;stroke:var(--line);stroke-width:2;}
.edge-line.related{stroke-dasharray:4 5;stroke:var(--ink-soft);opacity:.65;}

#nodes-layer{position:absolute;left:0;top:0;}
.node-card{
  position:absolute;
  transform:translate(-50%,-50%);
  min-width:132px;
  max-width:190px;
  background:var(--card-bg);
  border-radius:10px;
  border:1.5px solid var(--type-color, var(--line));
  box-shadow:var(--shadow);
  padding:9px 11px 8px;
  cursor:pointer;
  user-select:none;
  transition:box-shadow .12s, transform .12s;
}
.node-card.kind-category{border-style:dashed;}
.node-card:active{transform:translate(-50%,-50%) scale(.97);}
.node-card.selected{
  box-shadow:0 0 0 3px var(--type-color, var(--ink)), var(--shadow);
}
.node-card.dim{opacity:.28;}
.node-card .type-tag{
  display:inline-block;
  font-size:10px;
  font-weight:700;
  color:var(--type-color);
  letter-spacing:.03em;
  margin-bottom:3px;
}
.node-card .node-title{
  font-size:13.5px;
  font-weight:700;
  line-height:1.35;
  word-break:break-word;
  color:var(--ink);
}
.node-card .node-meta{
  display:flex;
  gap:6px;
  margin-top:5px;
  font-size:10.5px;
  color:var(--ink-soft);
}
.node-card.is-root{
  border-width:2.5px;
  font-family:var(--font-display);
}
.node-card.is-root .node-title{font-size:15px;}

.collapse-toggle{
  position:absolute;
  right:-9px;bottom:-9px;
  width:22px;height:22px;
  border-radius:50%;
  background:var(--type-color, var(--ink));
  color:var(--card-bg);
  border:2px solid var(--card-bg);
  font-size:11px;
  font-weight:700;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  box-shadow:0 1px 4px rgba(0,0,0,.25);
}

/* ---------- canvas controls & legend ---------- */
#canvas-controls{
  position:absolute;right:14px;bottom:14px;
  display:flex;flex-direction:column;gap:6px;
  z-index:10;
}
#canvas-controls button{
  width:38px;height:38px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--card-bg);
  color:var(--ink);
  font-size:17px;
  box-shadow:var(--shadow);
  cursor:pointer;
}
#fit-view{width:auto !important;padding:0 10px;font-size:12px !important;}

#legend{
  position:absolute;left:14px;bottom:14px;
  background:var(--card-bg);
  border:1px solid var(--line);
  border-radius:10px;
  padding:8px 10px;
  font-size:11px;
  box-shadow:var(--shadow);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:3px 12px;
  z-index:10;
  max-width:210px;
}
#legend .legend-row{display:flex;align-items:center;gap:5px;color:var(--ink-soft);white-space:nowrap;}
#legend .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
#legend .dot.dashed{border:1.5px dashed var(--accent-category);background:transparent;}

#empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:4px;
  text-align:center;color:var(--ink-soft);
  font-size:14px;padding:40px 20px;
}

/* ---------- list view ---------- */
#list-view{
  flex:1 1 auto;
  overflow-y:auto;
  padding:16px 14px 40px;
  background:var(--bg);
}
.list-branch-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.branch-pill{
  flex:1 1 calc(50% - 4px);
  border:1.5px solid var(--line);
  background:var(--card-bg);
  color:var(--ink-soft);
  padding:10px 8px;
  border-radius:10px;
  font-size:13.5px;
  font-weight:700;
  cursor:pointer;
}
.branch-pill.active{border-color:var(--ink);color:var(--ink);background:var(--panel-bg);}

.list-level{margin-bottom:16px;}
.list-level-label{
  font-size:11.5px;font-weight:700;color:var(--ink-soft);
  margin-bottom:7px;letter-spacing:.02em;
}
.list-chip-row{display:flex;flex-wrap:wrap;gap:7px;}
.list-cat-chip-wrap{position:relative;display:inline-flex;align-items:center;gap:3px;background:var(--card-bg);border-radius:8px;}
.list-cat-chip-del, .list-cat-chip-ren{
  position:static;
  width:26px;height:26px;min-width:26px;border-radius:50%;
  font-size:12px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  padding:0;flex:0 0 auto;
}
.list-cat-chip-del{
  background:var(--danger);color:#fff;border:1px solid var(--danger);
}
.list-cat-chip-ren{
  background:var(--card-bg);color:var(--ink);border:1px solid var(--line);
}
.list-cat-chip{
  border:1.5px dashed var(--accent-category);
  color:var(--ink);
  background:var(--card-bg);
  border-radius:8px;
  padding:8px 12px;
  font-size:13px;
  cursor:pointer;
}
.list-cat-chip.active{background:var(--accent-category);color:var(--card-bg);border-style:solid;}
.list-cat-chip.add{border-style:dashed;color:var(--ink-soft);}

.list-items{margin-top:6px;}
.list-agg-btn{
  display:inline-block;
  border:none;background:transparent;
  color:var(--accent-category);
  font-size:12px;font-weight:700;
  text-decoration:underline;
  cursor:pointer;
  padding:2px 0 10px;
}
.list-cat-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:4px;}
.list-open-btn{
  border:1.5px solid var(--accent-category);
  background:transparent;color:var(--accent-category);
  border-radius:999px;padding:6px 13px;
  font-size:12px;font-weight:700;cursor:pointer;
}
.list-agg-header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-bottom:10px;
}
.list-agg-title{font-size:13.5px;font-weight:700;color:var(--ink);}
.list-agg-close{
  border:1px solid var(--line);background:var(--card-bg);color:var(--ink-soft);
  border-radius:999px;padding:5px 11px;font-size:11.5px;cursor:pointer;flex:0 0 auto;
}
.list-row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.list-row-crumb{font-size:10.5px;color:var(--ink-soft);}
.list-row-title-row{display:flex;align-items:center;gap:9px;}
.list-row{
  display:flex;align-items:flex-start;gap:9px;
  background:var(--card-bg);
  border:1px solid var(--line);
  border-left:4px solid var(--type-color, var(--line));
  border-radius:9px;
  padding:11px 12px;
  margin-bottom:7px;
  cursor:pointer;
}
.list-row-tag{font-size:10.5px;font-weight:700;color:var(--type-color);flex:0 0 auto;}
.list-row-title{font-size:14px;font-weight:600;flex:1;word-break:break-word;}
.list-row-meta{font-size:11px;color:var(--ink-soft);flex:0 0 auto;}
.list-search-hint{
  font-size:13px;font-weight:700;color:var(--ink-soft);
  margin-bottom:12px;
}
.tag-filter-wrap{margin-bottom:14px;}
.list-row-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px;}
.mini-tag{
  font-size:10.5px;color:var(--ink-soft);
  background:var(--bg-canvas);border-radius:999px;padding:2px 8px;
}
.list-empty-hint{
  color:var(--ink-soft);font-size:13px;
  padding:16px 4px;line-height:1.7;
}

/* ---------- detail panel ---------- */
#backdrop{
  position:fixed;inset:0;
  background:rgba(20,24,22,.38);
  z-index:29;
  display:none;
}
#backdrop.show{display:block;}

#detail-panel{
  position:fixed;
  z-index:30;
  background:var(--panel-bg);
  box-shadow:-4px 0 18px rgba(0,0,0,.16);
  display:flex;
  flex-direction:column;
  transform:translateX(100%);
  transition:transform .22s ease;
}
#detail-panel.open{transform:translateX(0);}

.panel-head{
  flex:0 0 auto;
  display:flex;align-items:flex-start;gap:10px;
  padding:14px 14px 10px;
  border-bottom:1px solid var(--line);
}
.panel-head .type-select{flex:0 0 auto;}
.cat-label{
  display:none;
  font-size:12.5px;font-weight:700;
  color:var(--accent-category);
  border:1.5px dashed var(--accent-category);
  border-radius:999px;
  padding:5px 12px;
}
.panel-head .close-btn{
  margin-left:auto;
  border:none;background:transparent;
  font-size:20px;line-height:1;color:var(--ink-soft);cursor:pointer;
  padding:4px;
}
.panel-body{flex:1 1 auto;overflow-y:auto;padding:14px;}
.field-group{margin-bottom:16px;}
.field-group label{
  display:block;
  font-size:11.5px;
  font-weight:700;
  color:var(--ink-soft);
  margin-bottom:5px;
  letter-spacing:.02em;
}
.field-group input[type=text],
.field-group textarea,
.field-group select{
  width:100%;
  padding:9px 10px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--card-bg);
  color:var(--ink);
  font-family:inherit;
  font-size:14px;
  resize:vertical;
}
.field-group textarea{min-height:76px;line-height:1.55;overflow-y:hidden;}
.field-group input:focus,.field-group textarea:focus,.field-group select:focus{
  outline:2px solid var(--type-color,var(--accent-movement));outline-offset:1px;
}
.title-input{
  font-size:17px !important;
  font-weight:700;
  border:none !important;
  padding:2px 0 !important;
  background:transparent !important;
}
.title-input:focus{outline:none !important;}

.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px;}
.media-thumb{
  position:relative;
  aspect-ratio:1/1;
  border-radius:7px;
  overflow:hidden;
  background:var(--bg-canvas);
  border:1px solid var(--line);
  cursor:pointer;
}
.media-thumb img,.media-thumb video{width:100%;height:100%;object-fit:cover;display:block;}
.media-thumb .rm-btn{
  position:absolute;top:2px;right:2px;
  width:18px;height:18px;border-radius:50%;
  background:rgba(20,20,20,.65);color:#fff;
  border:none;font-size:11px;line-height:1;cursor:pointer;
}
.media-thumb .vid-badge{
  position:absolute;bottom:2px;left:2px;
  background:rgba(20,20,20,.65);color:#fff;
  font-size:9px;padding:1px 4px;border-radius:4px;
}
.upload-btn{
  display:inline-flex;align-items:center;gap:6px;
  border:1px dashed var(--line);
  background:transparent;color:var(--ink-soft);
  padding:8px 12px;border-radius:8px;
  font-size:12.5px;cursor:pointer;width:100%;justify-content:center;
}
.upload-btn:hover{border-color:var(--ink-soft);}

.yt-open-btn{
  display:none;align-items:center;justify-content:center;gap:6px;
  margin-top:8px;padding:9px;border-radius:8px;
  background:#CC1F1A;color:#fff;
  font-size:13px;font-weight:700;text-decoration:none;
}

.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  background:var(--card-bg);
  border:1px solid var(--line);
  border-radius:999px;
  padding:5px 10px 5px 10px;
  font-size:12px;
  cursor:pointer;
  max-width:100%;
}
.chip .chip-x{border:none;background:transparent;color:var(--ink-soft);font-size:12px;cursor:pointer;padding:0;}
.chip-add{
  border:1px dashed var(--line);
  background:transparent;color:var(--ink-soft);
  border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;
}

function trackDirtyNodes(){

  var next = {};

/* ===================== storage: IndexedDB (localStorage fallback) =====================
   ノードデータの保存先は IndexedDB（DB: ema_atlas_db / ストア: kv / キー: 'nodes'）。
   上限が localStorage（5〜10MB程度）より桁違いに大きいため長期利用に耐える。
   初回起動時に旧 localStorage キャッシュ（ema_nodes_cache_v1）があれば移行し、
   書き込んで読み直して検証できたら旧キーを削除する。
   IndexedDB が使えない環境（プライベートモード等）では従来通り localStorage に
   保存・読み込みする動作へ自動で戻る。 */
var IDB_NAME = 'ema_atlas_db';
var IDB_STORE = 'kv';
var IDB_NODES_KEY = 'nodes';
var storageBackend = 'local'; // 'idb' | 'local'
var storageStatus = 'localStorage（従来方式）';
var storageBooting = true;    // 起動処理が終わるまでは保存しない（移行前の旧データを守る）
var storageMigrated = false;
var bootSettled = false;
var idbDb = null;
var idbWriteChain = Promise.resolve();
var idbWriteWarned = false;

function idbOpen(){
  return new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error('indexedDB unavailable')); return; }
    var req;
    try{ req = indexedDB.open(IDB_NAME, 1); }catch(e){ reject(e); return; }
    req.onupgradeneeded = function(){
      if(!req.result.objectStoreNames.contains(IDB_STORE)) req.result.createObjectStore(IDB_STORE);
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error('idb open failed')); };
    req.onblocked = function(){ reject(new Error('idb blocked')); };
  });
}
function idbGet(db, key){
  return new Promise(function(resolve, reject){
    var req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).get(key);
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error || new Error('idb get failed')); };
  });
}
function idbPut(db, key, value){
  return new Promise(function(resolve, reject){
    var tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(value, key);
    tx.oncomplete = function(){ resolve(); };
    tx.onerror = function(){ reject(tx.error || new Error('idb put failed')); };
    tx.onabort = function(){ reject(tx.error || new Error('idb put aborted')); };
  });
}
function readLegacyCache(){
  try{
    var raw = localStorage.getItem(LOCAL_CACHE_KEY);
    if(raw){
      var obj = JSON.parse(raw);
      if(obj && typeof obj === 'object') return obj;
    }
  }catch(e){}
  return null;
}

function persistLocalCache(){
  trackDirtyNodes();
  if(storageBooting) return; // 起動完了までは書き込まない（二重起動防止は settleBoot 側）
  if(storageBackend === 'idb' && idbDb){
    // 書き込みを直列化する。各書き込みは実行時点の最新の nodesById を保存するので、
    // 連続して呼ばれても最後の状態が必ず IndexedDB に残る。
    idbWriteChain = idbWriteChain.then(function(){
      return idbPut(idbDb, IDB_NODES_KEY, nodesById);
    }).catch(function(e){
      if(!idbWriteWarned){
        idbWriteWarned = true;
        showToast('保存に失敗しました。書き出しでバックアップを取ることをお勧めします');
      }
    });
    driveScheduleUpload();
    return;
  }
  try{ localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify(nodesById)); }catch(e){
    showToast('保存容量が上限に近づいています。写真を減らすか、バックアップ後に古いページを整理してください');
  }
  driveScheduleUpload();
}
function loadLocalCache(){
  if(storageBackend === 'idb') return; // IndexedDB の場合は bootstrapStorage で読み込み済み
  var obj = readLegacyCache();
  if(obj) nodesById = obj;
}

function settleBoot(){
  if(bootSettled) return false;
  bootSettled = true;
  return true;
}
function startAppAfterStorage(){
  if(!settleBoot()) return;
  storageBooting = false;
  init();
  if(storageMigrated) showToast('保存先をIndexedDBに移行しました（容量の上限が大きく広がりました）');
}
function fallbackToLocalStorage(reason){
  if(!settleBoot()) return;
  storageBackend = 'local';
  storageStatus = 'localStorage（' + reason + '）';
  idbDb = null;
  storageBooting = false;
  init();
}
function bootstrapStorage(){
  showLoadingState('データを読み込んでいます…');
  try{
    if(navigator.storage && navigator.storage.persist) navigator.storage.persist();
  }catch(e){}
  setTimeout(function(){ fallbackToLocalStorage('読み込みに時間がかかっているため従来方式で継続'); }, 6000);
  idbOpen().then(function(db){
    idbDb = db;
    return idbGet(db, IDB_NODES_KEY).then(function(stored){
      if(stored && typeof stored === 'object' && Object.keys(stored).length > 0){
        nodesById = stored;
        storageBackend = 'idb';
        storageStatus = 'IndexedDB（移行済み）';
        // 旧キャッシュが残っていれば掃除する（IndexedDB 側が正）
        try{
          if(localStorage.getItem(LOCAL_CACHE_KEY)) localStorage.removeItem(LOCAL_CACHE_KEY);
        }catch(e){}
        startAppAfterStorage();
        return;
      }
      var legacy = readLegacyCache();
      if(!legacy){
        nodesById = (stored && typeof stored === 'object') ? stored : {};
        storageBackend = 'idb';
        storageStatus = 'IndexedDB（新規）';
        startAppAfterStorage();
        return;
      }
      // 移行: IndexedDB に書き込み、読み直して件数を検証できたら旧キーを削除する
      idbPut(db, IDB_NODES_KEY, legacy).then(function(){
        return idbGet(db, IDB_NODES_KEY);
      }).then(function(verify){
        if(verify && typeof verify === 'object' && Object.keys(verify).length === Object.keys(legacy).length){
          try{ localStorage.removeItem(LOCAL_CACHE_KEY); }catch(e){}
          nodesById = verify;
          storageBackend = 'idb';
          storageStatus = 'IndexedDB（localStorageから移行完了）';
          storageMigrated = true;
          startAppAfterStorage();
        } else {
          fallbackToLocalStorage('移行の検証に失敗したため従来方式で継続');
        }
      }).catch(function(){
        fallbackToLocalStorage('移行に失敗したため従来方式で継続');
      });
    });
  }).catch(function(){
    fallbackToLocalStorage('IndexedDBが使えないため従来方式で継続');
  });
}

function ensureRoots(){
  var changed = false;
  BRANCH_ORDER.forEach(function(b){
    var id = ROOT_IDS[b];
    var d = nodesById[id];
    if(!d){
      nodesById[id] = {
        id: id, parentId: null, category: b, kind: 'category', catLevel: 'branch',
        title: BRANCH_META[b].label, note: '', media: [], relatedIds: [], tags: [],
        createdAt: Date.now()
      };
      changed = true;
    } else {
      if(!d.kind || !d.catLevel || d.category !== b){
        d.category = b; d.kind = 'category'; d.catLevel = 'branch';
        changed = true;
      }
      if(!Array.isArray(d.media)) d.media = [];
      if(!Array.isArray(d.relatedIds)) d.relatedIds = [];
      if(!Array.isArray(d.tags)) d.tags = [];
    }
  });
  if(changed) persistLocalCache();
}

/* ===================== data ops ===================== */
function childrenOf(id){
  var out = [];
  for(var k in nodesById){ if(nodesById[k].parentId === id) out.push(nodesById[k]); }
  out.sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
  return out;
}

function nextStepFor(node){
  var branch = node.category;
  var chain = LEVEL_CHAIN[branch] || [];
  if(node.kind === 'category'){
    if(node.catLevel === 'branch'){
      if(chain.length) return { kind:'category', level:chain[0] };
      return (BRANCH_CONTENT_TYPES[branch]||[]).length ? { kind:'content', restrict:branch } : { kind:'none' };
    }
    var idx = chain.indexOf(node.catLevel);
    if(idx === -1 || idx === chain.length-1){
      return (BRANCH_CONTENT_TYPES[branch]||[]).length ? { kind:'content', restrict:branch } : { kind:'none' };
    }
    return { kind:'category', level:chain[idx+1] };
  }
  return { kind:'content', restrict:'detail' };
}

function debouncedUpdate(id, field, value, delay){
  if(nodesById[id]){ nodesById[id][field] = value; }
  var key = id + ':' + field;
  clearTimeout(pendingWrites[key]);
  pendingWrites[key] = setTimeout(function(){
    delete pendingWrites[key];
    persistLocalCache();
  }, delay || 400);
}
function fieldObj(field, value){ var o={}; o[field]=value; return o; }

function flushPendingWrites(id){
  var any = false;
  Object.keys(pendingWrites).forEach(function(key){
    if(key.indexOf(id + ':') !== 0) return;
    clearTimeout(pendingWrites[key]);
    delete pendingWrites[key];
    any = true;
  });
  if(any) persistLocalCache();
}

function immediateUpdate(id, patch){
  if(nodesById[id]){ Object.assign(nodesById[id], patch); persistLocalCache(); }
}

function collectDescendantIds(id){
  var out = [];
  var stack = [id];
  while(stack.length){
    var cur = stack.pop();
    childrenOf(cur).forEach(function(c){ out.push(c.id); stack.push(c.id); });
  }
  return out;
}

function deleteNode(id){
  var node = nodesById[id];
  if(!node || (node.parentId === null && node.kind !== 'memo' && node.kind !== 'knowledge')) return;
  var toDelete = [id].concat(collectDescendantIds(id));
  var toDeleteSet = new Set(toDelete);

  for(var k in nodesById){
    if(toDeleteSet.has(k)) continue;
    var n = nodesById[k];
    if(n.relatedIds && n.relatedIds.some(function(r){return toDeleteSet.has(r);})){
      n.relatedIds = n.relatedIds.filter(function(r){return !toDeleteSet.has(r);});
    }
  }
  toDelete.forEach(function(nid){ delete nodesById[nid]; });
  persistLocalCache();
  closePanel();
  renderListView();
  showToast(toDelete.length > 1 ? (toDelete.length + '件のノードを削除しました') : 'ノードを削除しました');
}

function addRelation(idA, idB){
  var a = nodesById[idA], b = nodesById[idB];
  if(!a || !b) return;
  var relA = (a.relatedIds||[]).slice(); if(relA.indexOf(idB)===-1) relA.push(idB);
  var relB = (b.relatedIds||[]).slice(); if(relB.indexOf(idA)===-1) relB.push(idA);
  a.relatedIds = relA; b.relatedIds = relB;
  persistLocalCache();
}
function removeRelation(idA, idB){
  var a = nodesById[idA], b = nodesById[idB];
  if(!a || !b) return;
  a.relatedIds = (a.relatedIds||[]).filter(function(x){return x!==idB;});
  b.relatedIds = (b.relatedIds||[]).filter(function(x){return x!==idA;});
  persistLocalCache();
}

function getAllTags(){
  var set = {};
  Object.keys(nodesById).forEach(function(id){
    (nodesById[id].tags||[]).forEach(function(t){ set[t] = true; });
  });
  return Object.keys(set).sort(function(a,b){ return a.localeCompare(b,'ja'); });
}

function getTagCounts(){
  var counts = {};
  Object.keys(nodesById).forEach(function(id){
    var n = nodesById[id];
    if(n.kind !== 'content' && n.kind !== 'category') return;
    (n.tags||[]).forEach(function(t){ counts[t] = (counts[t]||0) + 1; });
  });
  return counts;
}
function sortedTagsByCount(){
  var counts = getTagCounts();
  return Object.keys(counts).sort(function(a,b){
    if(counts[b] !== counts[a]) return counts[b] - counts[a];
    return a.localeCompare(b, 'ja');
  }).map(function(t){ return { tag: t, count: counts[t] }; });
}

/* video start offset: YouTube takes ?t=秒, Vimeo takes #t=秒s */
function formatStartSec(sec){
  sec = parseInt(sec, 10) || 0;
  if(sec <= 0) return '';
  var m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? (m + '分' + (s ? s + '秒' : '')) : (s + '秒');
}
function videoUrlWithStart(url, sec){
  sec = parseInt(sec, 10) || 0;
  if(!url || sec <= 0) return url;
  if(/vimeo\.com/.test(url)){
    return url.split('#')[0] + '#t=' + sec + 's';
  }
  if(/youtube\.com|youtu\.be/.test(url)){
    if(/[?&]t=/.test(url)) return url.replace(/([?&])t=[^&]*/, '$1t=' + sec);
    return url + (url.indexOf('?') === -1 ? '?' : '&') + 't=' + sec;
  }
  return url;
}

function renameTagEverywhere(oldTag, newTag){
  var count = 0;
  Object.keys(nodesById).forEach(function(id){
    var n = nodesById[id];
    if(!n.tags || n.tags.indexOf(oldTag) === -1) return;
    var next = n.tags.map(function(t){ return t === oldTag ? newTag : t; });
    // avoid duplicate tags if newTag already existed on this node
    var seen = {};
    next = next.filter(function(t){ if(seen[t]) return false; seen[t]=true; return true; });
    n.tags = next;
    count++;
  });
  if(count) persistLocalCache();
  return count;
}

function addTag(id, tag){
  var n = nodesById[id];
  if(!n) return;
  var tags = (n.tags||[]).slice();
  if(tags.indexOf(tag) === -1) tags.push(tag);
  n.tags = tags;
  persistLocalCache();
  renderPanelContent(n);
  if(currentView === 'list') renderListView();
}
function removeTag(id, tag){
  var n = nodesById[id];
  if(!n) return;
  n.tags = (n.tags||[]).filter(function(t){ return t !== tag; });
  persistLocalCache();
  renderPanelContent(n);
  if(currentView === 'list') renderListView();
}

/* Photos are downscaled client-side and stored as base64 data URIs directly
   in the node (no server, no separate blob store). Videos aren't supported
   here — use a YouTube link instead (see the training/treatment fields). */
var MAX_IMAGE_DIM = 1000;
function fileToCompressedDataUrl(file){
  return new Promise(function(resolve, reject){
    if(!/^image\//.test(file.type)){ reject(new Error('not an image')); return; }
    var img = new Image();
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('read failed')); };
    reader.onload = function(){
      img.onerror = function(){ reject(new Error('decode failed')); };
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight;
        var scale = Math.min(1, MAX_IMAGE_DIM / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * scale));
        var ch = Math.max(1, Math.round(h * scale));
        var canvas = document.createElement('canvas');
        canvas.width = cw; canvas.height = ch;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, cw, ch);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Re-encode an already-stored image data URL at a smaller size. Same canvas
   approach as fileToCompressedDataUrl, but the input is a data URL instead of
   a File. Used by the one-shot "compress all images" action (feature A). */
var COMPRESS_MAX_DIM = 700;
var COMPRESS_QUALITY = 0.6;
function dataUrlToCompressedDataUrl(dataUrl, maxDim, quality){
  return new Promise(function(resolve, reject){
    var img = new Image();
    img.onerror = function(){ reject(new Error('decode failed')); };
    img.onload = function(){
      var w = img.naturalWidth, h = img.naturalHeight;
      if(!w || !h){ reject(new Error('empty image')); return; }
      var scale = Math.min(1, maxDim / Math.max(w, h)); // never upscale
      var cw = Math.max(1, Math.round(w * scale));
      var ch = Math.max(1, Math.round(h * scale));
      var canvas = document.createElement('canvas');
      canvas.width = cw; canvas.height = ch;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, cw, ch);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.src = dataUrl;
  });
}

/* Feature A: recompress every stored image in place. A failure (or a result
   that would grow the data) leaves that image untouched; videos are skipped. */
async function compressAllImages(){
  var targets = [];
  Object.keys(nodesById).forEach(function(id){
    (nodesById[id].media || []).forEach(function(m){
      if(m && m.kind === 'image' && typeof m.dataUrl === 'string' && m.dataUrl.indexOf('data:image/') === 0){
        targets.push(m);
      }
    });
  });
  if(!targets.length){ showToast('圧縮できる画像がありません'); return; }
  var before = 0, after = 0, replaced = 0;
  targets.forEach(function(m){ before += m.dataUrl.length; });
  for(var i=0;i<targets.length;i++){
    var m = targets[i];
    try{
      var next = await dataUrlToCompressedDataUrl(m.dataUrl, COMPRESS_MAX_DIM, COMPRESS_QUALITY);
      if(next && next.length < m.dataUrl.length){
        m.dataUrl = next;
        m.contentType = 'image/jpeg';
        replaced++;
      }
    }catch(e){ /* keep the original image */ }
    after += m.dataUrl.length;
  }
  if(replaced){
    persistLocalCache();
    renderListView();
    if(selectedId && nodesById[selectedId]) renderPanelContent(nodesById[selectedId]);
    showToast('画像を圧縮しました: ' + (before/1000000).toFixed(1) + 'MB → ' + (after/1000000).toFixed(1) + 'MB（' + replaced + '枚）');
  } else {
    showToast('すでに十分小さい画像ばかりでした（' + targets.length + '枚を確認）');
  }
}

var MAX_VIDEO_BYTES = 4 * 1024 * 1024; // 4MB — localStorage's total quota (often ~5-10MB) can't realistically hold much more
function fileToRawDataUrl(file){
  return new Promise(function(resolve, reject){
    var reader = new FileReader();
    reader.onerror = function(){ reject(new Error('read failed')); };
    reader.onload = function(){ resolve(reader.result); };
    reader.readAsDataURL(file);
  });
}

async function addMediaFiles(id, files){
  for(var i=0;i<files.length;i++){
    var f = files[i];
    try{
      if(/^video\//.test(f.type)){
        if(f.size > MAX_VIDEO_BYTES){
          showToast('この動画は大きすぎます（4MBまで）。長い動画は動画リンク欄をご利用ください');
          continue;
        }
        var vDataUrl = await fileToRawDataUrl(f);
        var vMedia = (nodesById[id].media || []).slice();
        vMedia.push({ id: newId(), contentType: f.type || 'video/mp4', dataUrl: vDataUrl, kind:'video' });
        nodesById[id].media = vMedia;
        persistLocalCache();
        renderPanelContent(nodesById[id]);
      } else {
        var dataUrl = await fileToCompressedDataUrl(f);
        var media = (nodesById[id].media || []).slice();
        media.push({ id: newId(), contentType: 'image/jpeg', dataUrl: dataUrl, kind:'image' });
        nodesById[id].media = media;
        persistLocalCache();
        renderPanelContent(nodesById[id]);
      }
    }catch(e){
      showToast('この形式は読み込めませんでした');
    }
  }
}
function removeMedia(id, assetId){
  var node = nodesById[id];
  if(!node) return;
  node.media = (node.media||[]).filter(function(m){ return m.id !== assetId; });
  persistLocalCache();
  renderPanelContent(node);
}

/* ===================== layout (map) ===================== */
function computeLayout(){
  var positions = {};
  var leafCounter = { n: 0 };

  function visibleChildren(node){
    if(collapsed.has(node.id)) return [];
    return childrenOf(node.id).filter(passesFilter);
  }

  function place(node, depth){
    var kids = visibleChildren(node);
    var x;
    if(kids.length === 0){
      x = leafCounter.n;
      leafCounter.n += 1;
    } else {
      var xs = kids.map(function(k){ return place(k, depth+1); });
      x = (xs[0] + xs[xs.length-1]) / 2;
    }
    positions[node.id] = { gx: x, gy: depth };
    return x;
  }

  var roots = ['competitive','general']
    .filter(function(c){ return categoryFilter==='all' || categoryFilter===c; })
    .map(function(c){ return nodesById[ROOT_IDS[c]]; })
    .filter(Boolean);

  roots.forEach(function(r){ place(r, 0); });

  var px = {};
  Object.keys(positions).forEach(function(id){
    var p = positions[id];
    px[id] = {
      x: p.gx * NODE_H_SPACING + NODE_H_SPACING/2,
      y: p.gy * NODE_V_SPACING + 60
    };
  });
  return px;
}

function passesFilter(node){
  if(categoryFilter !== 'all' && node.category !== categoryFilter) return false;
  return true;
}

function matchesSearch(node){
  if(!searchQuery) return true;
  var keywords = searchQuery.toLowerCase().split(/\s+/).filter(Boolean);
  if(!keywords.length) return true;
  var haystack = [
    node.title||'', node.note||'',
    node.causeText||'', node.effectText||'', node.correctionText||'',
    (node.tags||[]).join(' ')
  ].join(' ').toLowerCase();
  return keywords.every(function(k){ return haystack.indexOf(k) !== -1; });
}

function ancestorsOf(id){
  var out = [];
  var cur = nodesById[id];
  while(cur && cur.parentId){
    out.push(cur.parentId);
    cur = nodesById[cur.parentId];
  }
  return out;
}
function ensureVisiblePath(id){
  ancestorsOf(id).forEach(function(a){ collapsed.delete(a); });
}

/* ===================== render: map ===================== */
var isDragMove = false;

function renderAll(){
  if(currentView !== 'map') return;
  if(searchQuery){
    Object.keys(nodesById).forEach(function(id){
      if(matchesSearch(nodesById[id]) && nodesById[id].parentId) ensureVisiblePath(id);
    });
  }
  var positions = computeLayout();
  renderNodes(positions);
  renderEdges(positions);
}

function typeMetaOf(node){
  if(node.kind === 'category') return { label: node.catLevel==='branch' ? '大カテゴリー' : (LEVEL_LABEL[node.catLevel]||''), cssVar: CATEGORY_CSS_VAR };
  return TYPE_META[node.type] || TYPE_META.note;
}

function renderNodes(positions){
  var layer = $('#nodes-layer');
  layer.innerHTML = '';
  var maxX = 0, maxY = 0;

  Object.keys(positions).forEach(function(id){
    var node = nodesById[id];
    if(!node) return;
    var pos = positions[id];
    maxX = Math.max(maxX, pos.x); maxY = Math.max(maxY, pos.y);

    var card = el('div', 'node-card');
    if(node.kind === 'category') card.classList.add('kind-category');
    if(node.parentId === null) card.classList.add('is-root');
    if(id === selectedId) card.classList.add('selected');
    if(searchQuery && node.parentId !== null && !matchesSearch(node)) card.classList.add('dim');

    var meta = typeMetaOf(node);
    card.style.setProperty('--type-color', 'var(' + meta.cssVar + ')');
    card.style.left = pos.x + 'px';
    card.style.top = pos.y + 'px';

    var tag = el('div','type-tag'); tag.textContent = meta.label;
    var title = el('div','node-title'); title.textContent = node.title || '(無題)';
    card.appendChild(tag);
    card.appendChild(title);

    var metaRow = el('div','node-meta');
    if(node.media && node.media.length){ var m=el('span'); m.textContent='📎'+node.media.length; metaRow.appendChild(m); }
    if(node.relatedIds && node.relatedIds.length){ var r=el('span'); r.textContent='🔗'+node.relatedIds.length; metaRow.appendChild(r); }
    if(metaRow.children.length) card.appendChild(metaRow);

    card.addEventListener('click', function(nid){
      return function(){ if(isDragMove) return; openPanel(nid); };
    }(id));

    var kids = childrenOf(id);
    if(kids.length){
      var toggle = el('div','collapse-toggle');
      toggle.style.setProperty('--type-color', 'var(' + meta.cssVar + ')');
      toggle.textContent = collapsed.has(id) ? String(kids.length) : '−';
      toggle.addEventListener('click', function(nid){
        return function(ev){
          ev.stopPropagation();
          if(collapsed.has(nid)) collapsed.delete(nid); else collapsed.add(nid);
          saveCollapsed();
          renderAll();
        };
      }(id));
      card.appendChild(toggle);
    }

    layer.appendChild(card);
  });

  var svg = $('#edge-svg');
  svg.setAttribute('width', Math.max(maxX + 260, 800));
  svg.setAttribute('height', Math.max(maxY + 200, 600));
}

function renderEdges(positions){
  var svg = $('#edge-svg');
  var lines = '';
  Object.keys(positions).forEach(function(id){
    var node = nodesById[id];
    if(!node || node.parentId === null) return;
    var p1 = positions[node.parentId], p2 = positions[id];
    if(!p1 || !p2) return;
    var midY = (p1.y + p2.y) / 2;
    lines += '<path class="edge-line" d="M '+p1.x+' '+p1.y+' C '+p1.x+' '+midY+', '+p2.x+' '+midY+', '+p2.x+' '+p2.y+'"/>';
  });
  var seen = {};
  Object.keys(positions).forEach(function(id){
    var node = nodesById[id];
    if(!node || !node.relatedIds) return;
    node.relatedIds.forEach(function(rid){
      var key = [id,rid].sort().join('|');
      if(seen[key]) return; seen[key]=true;
      var p1 = positions[id], p2 = positions[rid];
      if(!p1 || !p2) return;
      var mx=(p1.x+p2.x)/2, my=(p1.y+p2.y)/2 - 24;
      lines += '<path class="edge-line related" d="M '+p1.x+' '+p1.y+' Q '+mx+' '+my+', '+p2.x+' '+p2.y+'"/>';
    });
  });
  svg.innerHTML = lines;
}

/* ===================== pan / zoom ===================== */
function applyTransform(){
  $('#canvas-world').style.transform = 'translate('+pan.x+'px,'+pan.y+'px) scale('+zoom+')';
}
function setZoom(nz, cx, cy){
  nz = Math.max(0.35, Math.min(2, nz));
  var vp = $('#canvas-viewport').getBoundingClientRect();
  cx = cx === undefined ? vp.width/2 : cx;
  cy = cy === undefined ? vp.height/2 : cy;
  var wx = (cx - pan.x) / zoom;
  var wy = (cy - pan.y) / zoom;
  zoom = nz;
  pan.x = cx - wx*zoom;
  pan.y = cy - wy*zoom;
  applyTransform();
}
function fitView(){
  var positions = computeLayout();
  var ids = Object.keys(positions);
  if(!ids.length){ pan={x:40,y:40}; zoom=1; applyTransform(); return; }
  var xs = ids.map(function(i){return positions[i].x;});
  var ys = ids.map(function(i){return positions[i].y;});
  var minX=Math.min.apply(null,xs)-100, maxX=Math.max.apply(null,xs)+100;
  var minY=Math.min.apply(null,ys)-100, maxY=Math.max.apply(null,ys)+100;
  var vp = $('#canvas-viewport').getBoundingClientRect();
  var scaleX = vp.width/(maxX-minX), scaleY = vp.height/(maxY-minY);
  zoom = Math.max(0.35, Math.min(1.15, Math.min(scaleX,scaleY)));
  pan.x = -minX*zoom + (vp.width-(maxX-minX)*zoom)/2;
  pan.y = -minY*zoom;
  applyTransform();
}

function bindCanvasGestures(){
  var vp = $('#canvas-viewport');
  var lastX, lastY, moved;

  vp.addEventListener('pointerdown', function(ev){
    if(ev.target.closest('.node-card') || ev.target.closest('#canvas-controls')) return;
    isDragging = true; moved = false;
    lastX = ev.clientX; lastY = ev.clientY;
    vp.classList.add('dragging');
    vp.setPointerCapture(ev.pointerId);
  });
  vp.addEventListener('pointermove', function(ev){
    if(!isDragging) return;
    var dx = ev.clientX-lastX, dy = ev.clientY-lastY;
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved = true;
    pan.x += dx; pan.y += dy;
    lastX = ev.clientX; lastY = ev.clientY;
    applyTransform();
  });
  function endDrag(){
    if(!isDragging) return;
    isDragging = false;
    vp.classList.remove('dragging');
    isDragMove = moved;
    setTimeout(function(){ isDragMove = false; }, 50);
  }
  vp.addEventListener('pointerup', endDrag);
  vp.addEventListener('pointercancel', endDrag);

  vp.addEventListener('wheel', function(ev){
    ev.preventDefault();
    var rect = vp.getBoundingClientRect();
    var cx = ev.clientX-rect.left, cy = ev.clientY-rect.top;
    var delta = ev.deltaY > 0 ? -0.09 : 0.09;
    setZoom(zoom + delta*zoom, cx, cy);
  }, { passive:false });

  var pinchDist = null;
  vp.addEventListener('touchstart', function(ev){
    if(ev.touches.length===2){
      pinchDist = Math.hypot(
        ev.touches[0].clientX-ev.touches[1].clientX,
        ev.touches[0].clientY-ev.touches[1].clientY
      );
    }
  }, {passive:true});
  vp.addEventListener('touchmove', function(ev){
    if(ev.touches.length===2 && pinchDist){
      var d = Math.hypot(
        ev.touches[0].clientX-ev.touches[1].clientX,
        ev.touches[0].clientY-ev.touches[1].clientY
      );
      var rect = vp.getBoundingClientRect();
      var cx = (ev.touches[0].clientX+ev.touches[1].clientX)/2-rect.left;
      var cy = (ev.touches[0].clientY+ev.touches[1].clientY)/2-rect.top;
      setZoom(zoom * (d/pinchDist), cx, cy);
      pinchDist = d;
    }
  }, {passive:true});
  vp.addEventListener('touchend', function(ev){ if(ev.touches.length<2) pinchDist=null; });

  $('#zoom-in').addEventListener('click', function(){ setZoom(zoom+0.18); });
  $('#zoom-out').addEventListener('click', function(){ setZoom(zoom-0.18); });
  $('#fit-view').addEventListener('click', fitView);
}

  var ndOpen = nodesById[id];
  if(ndOpen){

function renderPanelContent(node){
  if(!node){
    $('#p-type').style.display = 'none';
    $('#p-cat-label').style.display = 'none';
    $('#p-body').innerHTML = '<div class="root-note">読み込み中…</div>';
    return;
  }
  if(node.kind === 'memo' || node.kind === 'knowledge'){ renderCardPanel(node); return; }
  var isRoot = node.parentId === null;
  var isCategory = node.kind === 'category';
  var meta = typeMetaOf(node);

  var typeSel = $('#p-type');
  var catLabel = $('#p-cat-label');
  if(isCategory){
    typeSel.style.display = 'none';
    catLabel.style.display = 'inline-block';
    catLabel.textContent = meta.label;
  } else {
    catLabel.style.display = 'none';
    typeSel.style.display = '';
    typeSel.innerHTML = '';
    typeSel.disabled = !editMode;
    var sameFamily = MOVEMENT_TYPES.indexOf(node.type) !== -1 ? MOVEMENT_TYPES
      : node.type === 'trainingMethod' ? ['trainingMethod']
      : node.type === 'treatmentMethod' ? ['treatmentMethod']
      : node.type === 'classification' ? ['classification']
      : DETAIL_TYPES;
    sameFamily.forEach(function(t){
      var o = el('option'); o.value = t; o.textContent = TYPE_META[t].label;
      if(t === node.type) o.selected = true;
      typeSel.appendChild(o);
    });
    typeSel.style.color = cssColor(meta.cssVar);
    typeSel.onchange = function(){ immediateUpdate(node.id, { type: typeSel.value }); };
  }

  var body = $('#p-body');
  body.innerHTML = '';

  // title
  var titleGroup = el('div','field-group');
  var titleInput = el('input'); titleInput.type='text'; titleInput.className='title-input';
  titleInput.value = node.title || '';
  titleInput.placeholder = 'タイトルを入力';
  titleInput.readOnly = isRoot || !editMode;
  titleInput.addEventListener('input', function(){ debouncedUpdate(node.id, 'title', titleInput.value); });
  titleGroup.appendChild(titleInput);
  body.appendChild(titleGroup);

  // pin toggle — pinned pages are grouped at the top of the list view
  if(!isRoot && node.kind === 'content'){
    var pinGroup = el('div','field-group');
    var pinBtn = el('button','pin-btn' + (node.pinned ? ' active' : ''));
    pinBtn.type = 'button';
    pinBtn.textContent = node.pinned ? '📌 ピン留め中（タップで解除）' : '📌 ピン留めする';
    pinBtn.addEventListener('click', function(){
      node.pinned = !node.pinned;
      persistLocalCache();
      renderPanelContent(node);
      if(currentView === 'list') renderListView();
    });
    pinGroup.appendChild(pinBtn);
    body.appendChild(pinGroup);
  }

  // note
  if((!isCategory || !isRoot) && node.type !== 'treatmentMethod'){
    var noteGroup = el('div','field-group');
    var noteLabel = el('label');
    noteLabel.textContent = node.type==='anatomy' ? '解剖学的な内容' : node.type==='physiology' ? '生理学的な内容' : node.type==='effect' ? '影響の内容' : node.type==='trainingMethod' ? 'やり方・手順' : (MOVEMENT_TYPES.indexOf(node.type)!==-1 ? '動作の説明' : (isCategory ? '補足メモ' : '詳細メモ'));
    var noteArea = el('textarea');
    noteArea.value = node.note || '';
    noteArea.placeholder = '症状の特徴、根拠、参考文献、練習ドリルなど自由に記録';
    noteArea.readOnly = !editMode;
    noteArea.addEventListener('input', function(){ debouncedUpdate(node.id, 'note', noteArea.value); autoGrow(noteArea); });
    noteGroup.appendChild(noteLabel); noteGroup.appendChild(noteArea);
    body.appendChild(noteGroup);
    autoGrow(noteArea);
  }

  // treatment method pages get dedicated structured fields instead of one free note
  if(node.type === 'treatmentMethod'){
    var anyTreatmentFieldFilled = TREATMENT_FIELD_DEFS.some(function(fd){ return node[fd.key]; });
    TREATMENT_FIELD_DEFS.forEach(function(fd){
      var fg = el('div','field-group');
      var lbl = el('label'); lbl.textContent = fd.label;
      var ta = el('textarea');
      var initial = node[fd.key];
      if(!initial && !anyTreatmentFieldFilled && node.note && fd.key === 'treatmentEffect'){
        initial = node.note;
      }
      ta.value = initial || '';
      ta.placeholder = fd.label + 'を記録';
      ta.readOnly = !editMode;
      ta.addEventListener('input', function(k, area){
        return function(){ debouncedUpdate(node.id, k, area.value); autoGrow(area); };
      }(fd.key, ta));
      fg.appendChild(lbl); fg.appendChild(ta);
      body.appendChild(fg);
      autoGrow(ta);
    });
  }

  if(isRoot){
    var rn = el('div','root-note');
    var rootStep = nextStepFor(node);
    var rootNextLabel = rootStep.kind==='category' ? LEVEL_LABEL[rootStep.level] : 'ページ';
    rn.textContent = 'これは「' + BRANCH_META[node.category].label + '」の大カテゴリーです。下のボタンで' + rootNextLabel + 'を追加していきましょう。';
    body.appendChild(rn);
  }

  // Video link for training/treatment pages — embedding isn't reliable in this
  // environment, so this opens the video (YouTube or any other platform) in a new tab
  if(node.type === 'trainingMethod' || node.type === 'treatmentMethod'){
    var ytGroup = el('div','field-group');
    ytGroup.appendChild(labelEl('動画リンク（YouTubeや他サイトも可）'));
    var ytInput = el('input'); ytInput.type='text'; ytInput.placeholder='https://...（動画のURL）';
    ytInput.value = node.youtubeUrl || '';
    ytInput.readOnly = !editMode;
    var ytOpenBtn = el('a','yt-open-btn'); ytOpenBtn.target='_blank'; ytOpenBtn.rel='noopener';
    ytOpenBtn.textContent = '▶ 動画リンクを開く';
    var startLabel = el('label'); startLabel.textContent = '動画開始（秒）';
    startLabel.style.marginTop = '10px';
    var startInput = el('input'); startInput.type='number'; startInput.min='0'; startInput.step='1';
    startInput.placeholder = '例: 90（＝1分30秒から再生）';
    startInput.value = (node.videoStart != null && node.videoStart !== '') ? node.videoStart : '';
    startInput.readOnly = !editMode;
    function currentStart(){
      var s = parseInt(startInput.value, 10);
      return (isNaN(s) || s < 0) ? 0 : s;
    }
    function updateYtBtn(){
      var v = ytInput.value.trim();
      var sec = currentStart();
      if(v){
        ytOpenBtn.href = videoUrlWithStart(v, sec);
        ytOpenBtn.textContent = '▶ 動画リンクを開く' + (sec > 0 ? '（' + formatStartSec(sec) + 'から再生）' : '');
        ytOpenBtn.style.display = 'inline-flex';
      }
      else{ ytOpenBtn.removeAttribute('href'); ytOpenBtn.style.display = 'none'; }
    }

/* Replacement for window.prompt(), which WKWebView silently refuses to show
   when the page is running as an iOS Home Screen (standalone) app. */
function inlinePrompt(message, defaultValue, onConfirm, opts){
  var multiline = opts && opts.multiline;
  var modal = $('#text-prompt-modal');
  var label = $('#tp-label');
  var input = $('#tp-input');
  var ta = $('#tp-textarea');
  var okBtn = $('#tp-ok');
  var cancelBtn = $('#tp-cancel');
  var field = multiline ? ta : input;
  var other = multiline ? input : ta;

  label.textContent = message;
  field.value = defaultValue || '';
  field.hidden = false;
  other.hidden = true;
  modal.classList.add('show');
  setTimeout(function(){ field.focus(); if(field.select) field.select(); }, 50);

  function cleanup(){
    modal.classList.remove('show');
    okBtn.removeEventListener('click', onOk);
    cancelBtn.removeEventListener('click', onCancel);
    field.removeEventListener('keydown', onKey);
    modal.removeEventListener('click', onBackdrop);
  }
  function onOk(){ var v = field.value; cleanup(); onConfirm(v); }
  function onCancel(){ cleanup(); }
  function onKey(ev){
    if(!multiline && ev.key === 'Enter'){ ev.preventDefault(); onOk(); }
    else if(ev.key === 'Escape'){ onCancel(); }
  }
  function onBackdrop(ev){ if(ev.target.id === 'text-prompt-modal') onCancel(); }

  okBtn.addEventListener('click', onOk);
  cancelBtn.addEventListener('click', onCancel);
  field.addEventListener('keydown', onKey);
  modal.addEventListener('click', onBackdrop);
}

function openPicker(fromId, typeFilter, headTitle){
  var modal = $('#picker-modal');
  var list = $('#picker-list');
  var searchInput = $('#picker-search');
  searchInput.value = '';
  searchInput.placeholder = headTitle ? (headTitle + 'を検索して関連付け') : 'ノードを検索して関連付け';
  function render(q){
    list.innerHTML = '';
    var from = nodesById[fromId];
    var already = new Set((from.relatedIds||[]).concat([fromId]));
    var items = Object.keys(nodesById)
      .map(function(id){ return nodesById[id]; })
      .filter(function(n){ return !already.has(n.id); })
      .filter(function(n){ return n.kind === 'content' || n.kind === 'memo' || n.kind === 'knowledge'; })
      .filter(function(n){ return !typeFilter || typeFilter.indexOf(n.type) !== -1; })
      .filter(function(n){ return !q || (n.title||'').toLowerCase().indexOf(q.toLowerCase())!==-1; });
    items.forEach(function(n){
      var meta = typeMetaOf(n);
      var item = el('div','picker-item');
      var t = el('div','pi-title'); t.textContent = n.title || '(無題)';
      var mtext = el('div','pi-meta');
      mtext.textContent = meta.label + ' ・ ' + (n.kind === 'memo' ? (n.learnedAt || '学びメモ') : n.kind === 'knowledge' ? '基礎情報' : fullBreadcrumb(n));
      mtext.style.color = cssColor(meta.cssVar);
      item.appendChild(t); item.appendChild(mtext);
      item.addEventListener('click', function(){
        addRelation(fromId, n.id);
        modal.classList.remove('show');
      });
      list.appendChild(item);
    });
    if(!items.length){
      var empty = el('div'); empty.style.cssText='padding:20px;text-align:center;color:var(--ink-soft);font-size:13px;';
      empty.textContent = '該当するノードがありません';
      list.appendChild(empty);
    }
  }
  render('');
  searchInput.oninput = function(){ render(searchInput.value); };
  modal.classList.add('show');
}

/* ===================== render: list view ===================== */
function collectPageEntries(rootId){
  var out = [];
  var stack = [rootId];
  while(stack.length){
    var cur = stack.pop();
    childrenOf(cur).forEach(function(k){
      if(k.kind === 'content') out.push(k);
      else if(k.kind === 'category') stack.push(k.id);
    });
  }
  out.sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); });
  return out;
}
function breadcrumbFrom(node, stopId){
  var parts = [];
  var cur = nodesById[node.parentId];
  while(cur && cur.id !== stopId){
    parts.unshift(cur.title || '');
    cur = nodesById[cur.parentId];
  }
  return parts.join(' › ');
}

function fullBreadcrumb(node){
  var rootId = ROOT_IDS[node.category];
  var crumb = breadcrumbFrom(node, rootId);
  return BRANCH_META[node.category].label + (crumb ? ' › ' + crumb : '');
}

function renderSearchResults(){
  var wrap = $('#list-crumbs');
  wrap.innerHTML = '';
  var hint = el('div','list-search-hint');
  hint.textContent = searchQuery ? ('「' + searchQuery + '」の検索結果') : 'タグで絞り込み中（チップの✕で解除できます）';
  wrap.appendChild(hint);

  var typeFilterRow = el('div','mc-filter-row');
  MOVEMENT_TYPES.forEach(function(t){
    var btn = el('button','mc-pill' + (searchTypeFilter.indexOf(t)!==-1 ? ' active' : ''));
    btn.type = 'button';
    btn.style.setProperty('--mc-color', 'var(' + TYPE_META[t].cssVar + ')');
    btn.textContent = TYPE_META[t].label;
    btn.addEventListener('click', function(tt){
      return function(){
        var idx = searchTypeFilter.indexOf(tt);
        if(idx===-1) searchTypeFilter.push(tt); else searchTypeFilter.splice(idx,1);
        renderSearchResults();
      };
    }(t));
    typeFilterRow.appendChild(btn);
  });
  wrap.appendChild(typeFilterRow);

  var tagFilterWrap = el('div','tag-filter-wrap');
  var tagFilterChips = el('div','chip-row');
  searchTagFilter.forEach(function(tg){
    var chip = el('span','chip');
    var lbl = el('span'); lbl.textContent = '#' + tg;
    chip.appendChild(lbl);
    var x = el('button','chip-x'); x.textContent='✕';
    x.addEventListener('click', function(t2){ return function(){
      searchTagFilter = searchTagFilter.filter(function(x2){ return x2!==t2; });
      if(!searchQuery && !searchTagFilter.length) renderListView();
      else renderSearchResults();
    }; }(tg));
    chip.appendChild(x);
    tagFilterChips.appendChild(chip);
  });
  var tagFilterInputWrap = el('div','tag-input-wrap');
  var tagFilterInput = el('input'); tagFilterInput.type='text'; tagFilterInput.className='tag-input';
  tagFilterInput.placeholder = 'タグで絞り込む';
  var tagFilterSuggest = el('div','tag-suggest');
  function renderTagFilterSuggestions(){
    var q = tagFilterInput.value.trim().toLowerCase();
    var all = getAllTags().filter(function(t){ return searchTagFilter.indexOf(t)===-1; });
    var matches = q ? all.filter(function(t){ return t.toLowerCase().indexOf(q)!==-1; }) : all;
    tagFilterSuggest.innerHTML = '';
    if(!matches.length){ tagFilterSuggest.classList.remove('show'); return; }
    matches.slice(0,8).forEach(function(t){
      var item = el('div','tag-suggest-item');
      item.textContent = '#' + t;
      item.addEventListener('mousedown', function(ev){ ev.preventDefault(); });
      item.addEventListener('click', function(){
        searchTagFilter.push(t);
        tagFilterInput.value = '';
        tagFilterSuggest.classList.remove('show');
        renderSearchResults();
      });
      tagFilterSuggest.appendChild(item);
    });
    tagFilterSuggest.classList.add('show');
  }
  tagFilterInput.addEventListener('focus', renderTagFilterSuggestions);
  tagFilterInput.addEventListener('input', renderTagFilterSuggestions);
  tagFilterInput.addEventListener('blur', function(){ setTimeout(function(){ tagFilterSuggest.classList.remove('show'); }, 150); });
  tagFilterInput.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter'){
      ev.preventDefault();
      var v = tagFilterInput.value.trim().replace(/^#/, '');
      if(v && searchTagFilter.indexOf(v)===-1){ searchTagFilter.push(v); tagFilterInput.value=''; renderSearchResults(); }
    }
  });
  tagFilterInputWrap.appendChild(tagFilterInput);
  tagFilterInputWrap.appendChild(tagFilterSuggest);
  tagFilterChips.appendChild(tagFilterInputWrap);
  tagFilterWrap.appendChild(tagFilterChips);
  wrap.appendChild(tagFilterWrap);

  // full tag index — every tag with its page count, most used first;
  // tapping one adds it to the tag filter above
  var allTags = sortedTagsByCount();
  if(allTags.length){
    var tagIndexWrap = el('div','tag-filter-wrap');
    var tagIndexToggle = el('button','mc-filter-clear'); tagIndexToggle.type = 'button';
    tagIndexToggle.textContent = tagListOpen ? '✕ タグ一覧を閉じる' : ('タグ一覧（全' + allTags.length + '件）を開く');
    tagIndexToggle.addEventListener('click', function(){ tagListOpen = !tagListOpen; renderSearchResults(); });
    tagIndexWrap.appendChild(tagIndexToggle);
    if(tagListOpen){
      var tagIndexRow = el('div','chip-row');
      tagIndexRow.style.marginTop = '6px';
      allTags.forEach(function(entry){
        if(searchTagFilter.indexOf(entry.tag) !== -1) return;
        var chip = el('span','chip');
        chip.textContent = '#' + entry.tag + '（' + entry.count + '）';
        chip.addEventListener('click', function(t){ return function(){
          if(searchTagFilter.indexOf(t) === -1) searchTagFilter.push(t);
          renderSearchResults();
        }; }(entry.tag));
        tagIndexRow.appendChild(chip);
      });
      tagIndexWrap.appendChild(tagIndexRow);
    }
    wrap.appendChild(tagIndexWrap);
  }

  var itemsWrap = $('#list-items');
  itemsWrap.innerHTML = '';
  var results = Object.keys(nodesById)
    .map(function(id){ return nodesById[id]; })
    .filter(function(n){ return n.kind === 'content' && n.parentId !== null && matchesSearch(n); })
    .filter(function(n){ return !searchTypeFilter.length || searchTypeFilter.indexOf(n.type) !== -1; })
    .filter(function(n){
      if(!searchTagFilter.length) return true;
      var tags = n.tags||[];
      return searchTagFilter.every(function(t){ return tags.indexOf(t) !== -1; });
    })
    .sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

  if(!results.length){
    var e = el('div','list-empty-hint');
    e.textContent = '一致する項目がありません。';
    itemsWrap.appendChild(e);
    return;
  }
  results.forEach(function(n){
    var meta = TYPE_META[n.type]||TYPE_META.note;
    var row = el('div','list-row');
    row.style.setProperty('--type-color','var('+meta.cssVar+')');
    var col = el('div','list-row-main');
    var cr = el('div','list-row-crumb'); cr.textContent = fullBreadcrumb(n);
    col.appendChild(cr);
    var titleRow = el('div','list-row-title-row');
    var tag = el('span','list-row-tag'); tag.textContent = meta.label;
    var t = el('span','list-row-title'); t.textContent = n.title || '(無題)';
    titleRow.appendChild(tag); titleRow.appendChild(t);
    col.appendChild(titleRow);
    if(n.tags && n.tags.length){
      var tagsRow = el('div','list-row-tags');
      n.tags.forEach(function(tg){ var c=el('span','mini-tag'); c.textContent='#'+tg; tagsRow.appendChild(c); });
      col.appendChild(tagsRow);
    }
    row.appendChild(col);
    row.addEventListener('click', function(id){ return function(){ openPanel(id); }; }(n.id));
    itemsWrap.appendChild(row);
  });
}

/* shortcut sections shown on the plain list view: pinned pages, recently
   viewed pages, and the full tag index (tap a tag to filter by it) */
function renderShortcutSections(wrap){
  var pinned = Object.keys(nodesById).map(function(id){ return nodesById[id]; })
    .filter(function(n){ return n.pinned && n.kind === 'content'; })
    .sort(function(a, b){ return (a.title||'').localeCompare(b.title||'', 'ja'); });

    pw.appendChild(labelEl2('📌 ピン留め'));
    pinned.forEach(function(n){ pw.appendChild(buildNavRow(n)); });
    wrap.appendChild(pw);
  }

  var recent = loadRecentIds().map(function(id){ return nodesById[id]; })
    .filter(function(n){ return n && n.kind === 'content'; });
  if(recent.length){
    var rw = el('div','list-level');
    rw.appendChild(labelEl2('最近見た'));
    recent.forEach(function(n){ rw.appendChild(buildNavRow(n)); });
    wrap.appendChild(rw);
  }

  var allTags = sortedTagsByCount();
  if(allTags.length){
    var tagWrap = el('div','list-level');

    toggle.textContent = tagListOpen ? '✕ タグ一覧を閉じる' : ('タグ一覧（全' + allTags.length + '件）を開く');
    toggle.addEventListener('click', function(){ tagListOpen = !tagListOpen; renderListView(); });
    tagWrap.appendChild(toggle);
    if(tagListOpen){
      var chipsRow = el('div','chip-row');
      chipsRow.style.marginTop = '6px';
      allTags.forEach(function(entry){
        var chip = el('span','chip');
        chip.textContent = '#' + entry.tag + '（' + entry.count + '）';
        chip.addEventListener('click', function(t){ return function(){
          searchTagFilter = [t];
          renderListView();
        }; }(entry.tag));
        chipsRow.appendChild(chip);
      });
      tagWrap.appendChild(chipsRow);
    }

}

function renderListView(){
  if(mainTab === 'memo' || mainTab === 'knowledge'){ renderCardList(mainTab); return; }
  var cv = $('#card-view'); if(cv) cv.hidden = true;
  var lv = $('#list-view'); if(lv) lv.hidden = false;
  if(searchQuery || searchTagFilter.length){ renderSearchResults(); return; }
  var wrap = $('#list-crumbs');
  wrap.innerHTML = '';

  var branchRow = el('div','list-branch-row');
  BRANCH_ORDER.forEach(function(b){
    var btn = el('button','branch-pill' + (listState.branch===b?' active':''));
    btn.textContent = BRANCH_META[b].label;
    btn.addEventListener('click', function(bb){
      return function(){
        listState.branch = bb; listState.path = [];
        listCreatingLevel = null; listContentCreating = null; listAggregateId = null;
        listMethodFilter = [];
        renderListView();
      };
    }(b));
    branchRow.appendChild(btn);
  });
  wrap.appendChild(branchRow);

  var branchAggBtn = el('button','list-agg-btn');
  branchAggBtn.textContent = '「' + BRANCH_META[listState.branch].label + '」配下をすべてまとめて表示';
  branchAggBtn.addEventListener('click', function(){
    listAggregateId = ROOT_IDS[listState.branch];
    renderListView();
  });
  wrap.appendChild(branchAggBtn);

  renderShortcutSections(wrap);

  var branch = listState.branch;
  var chain = LEVEL_CHAIN[branch];
  var parentId = ROOT_IDS[branch];

  for(var i=0;i<chain.length;i++){
    var level = chain[i];
    var levelWrap = el('div','list-level');
    levelWrap.appendChild(labelEl2(LEVEL_LABEL[level]));

    var options = childrenOf(parentId).filter(function(n){ return n.kind==='category'; });
    var chipsRow = el('div','list-chip-row');
    options.forEach(function(opt){
      var wrap2 = el('span','list-cat-chip-wrap');
      var chip = el('button','list-cat-chip' + (listState.path[i]===opt.id?' active':''));
      chip.textContent = opt.title || '(無題)';
      chip.addEventListener('click', function(oid, idx){
        return function(){
          listState.path[idx] = oid;
          listState.path.length = idx+1;
          listCreatingLevel = null; listContentCreating = null; listAggregateId = null;
          renderListView();
        };
      }(opt.id, i));
      wrap2.appendChild(chip);
      if(editMode){
        var renChip = el('button','list-cat-chip-ren'); renChip.type='button'; renChip.textContent='✏️';
        renChip.title = '名前を変更';
        renChip.addEventListener('click', function(oid){
          return function(ev){
            ev.stopPropagation();
            var cur = nodesById[oid] ? nodesById[oid].title : '';
            inlinePrompt('新しい名前を入力してください', cur, function(next){
              next = (next||'').trim();
              if(!next) return;
              immediateUpdate(oid, { title: next });
              renderListView();
            });
          };
        }(opt.id));
        wrap2.appendChild(renChip);
        var delChip = el('button','list-cat-chip-del'); delChip.type='button'; delChip.textContent='✕';
        delChip.title = '削除';
        delChip.addEventListener('click', function(oid, idx){
          return function(ev){
            ev.stopPropagation();
            var descCount = collectDescendantIds(oid).length;
            var msg = descCount>0
              ? ('「' + (nodesById[oid]?nodesById[oid].title:'') + '」と、その中の' + descCount + '件をすべて削除しますか？この操作は取り消せません。')
              : ('「' + (nodesById[oid]?nodesById[oid].title:'') + '」を削除しますか？この操作は取り消せません。');
            if(confirm(msg)){
              if(listState.path[idx] === oid){ listState.path.length = idx; }
              deleteNode(oid);
              renderListView();
            }
          };
        }(opt.id, i));
        wrap2.appendChild(delChip);
      }
      chipsRow.appendChild(wrap2);
    });
    if(editMode){
      var addChip = el('button','list-cat-chip add');
      addChip.textContent = '＋ 新規';
      addChip.addEventListener('click', function(idx){
        return function(){ listCreatingLevel = idx; renderListView(); };
      }(i));
      chipsRow.appendChild(addChip);
    }
    levelWrap.appendChild(chipsRow);

    if(editMode && listCreatingLevel === i){
      levelWrap.appendChild(buildInlineCreator(LEVEL_LABEL[level] + '名を入力', function(pid, lvl, idx){
        return async function(title){
          var ref = await createCategoryNode(pid, listState.branch, lvl, title);
          if(ref){ listState.path[idx]=ref.id; listState.path.length=idx+1; }
          listCreatingLevel = null;
          renderListView();
        };
      }(parentId, level, i), function(){ listCreatingLevel=null; renderListView(); }));
    }

    if(listState.path[i]){
      var selNode = nodesById[listState.path[i]];
      var openRow = el('div','list-cat-actions');
      var openBtn = el('button','list-open-btn');
      openBtn.textContent = '「' + (selNode ? (selNode.title||'') : '') + '」のページを開く';
      openBtn.addEventListener('click', function(nid){
        return function(){ openPanel(nid); };
      }(listState.path[i]));
      openRow.appendChild(openBtn);
      var aggBtn = el('button','list-agg-btn');
      aggBtn.textContent = '配下をすべてまとめて表示';
      aggBtn.addEventListener('click', function(nid){
        return function(){ listAggregateId = nid; renderListView(); };
      }(listState.path[i]));
      openRow.appendChild(aggBtn);
      levelWrap.appendChild(openRow);
    }

    wrap.appendChild(levelWrap);

    if(!listState.path[i]) { parentId = null; break; }
    parentId = listState.path[i];
  }

  if(listAggregateId){
    renderAggregateList(listAggregateId);
  } else if(parentId && listState.path.length >= chain.length && (chain.length === 0 || listState.path[chain.length-1])){
    var leafId = chain.length === 0 ? ROOT_IDS[branch] : listState.path[chain.length-1];
    if((BRANCH_CONTENT_TYPES[branch]||[]).length === 0){
      var itemsWrap2 = $('#list-items');
      itemsWrap2.innerHTML = '';
      var leafNode = nodesById[leafId];
      var prompt = el('div','list-empty-hint');
      prompt.textContent = 'このページ自体に原因・根拠や分類などを記録できます。';
      itemsWrap2.appendChild(prompt);
      var openLeafBtn = el('button','list-open-btn');
      openLeafBtn.textContent = '「' + (leafNode ? (leafNode.title||'') : '') + '」を開く';
      openLeafBtn.addEventListener('click', function(){ openPanel(leafId); });
      itemsWrap2.appendChild(openLeafBtn);
    } else {
      renderContentList(leafId);
    }
  } else {
    var itemsWrap = $('#list-items');
    itemsWrap.innerHTML = '';
    var hint = el('div','list-empty-hint');
    hint.textContent = '上でカテゴリーを選択（または新規追加）すると、ここに項目の一覧が表示されます。「まとめて表示」ボタンで配下すべてを一気に見ることもできます。';
    itemsWrap.appendChild(hint);
  }
}

  entries.forEach(function(n){

function buildInlineCreator(placeholder, onConfirm, onCancel){
  var form = el('div','inline-create show');
  var input = el('input'); input.type='text'; input.placeholder = placeholder;
  var ok = el('button','confirm'); ok.type='button'; ok.textContent='追加';
  var cancel = el('button','cancel'); cancel.type='button'; cancel.textContent='キャンセル';
  form.appendChild(input); form.appendChild(ok); form.appendChild(cancel);
  ok.addEventListener('click', function(){
    var t = input.value.trim();
    if(!t) return;
    onConfirm(t);
  });
  input.addEventListener('keydown', function(ev){ if(ev.key==='Enter') ok.click(); });
  cancel.addEventListener('click', onCancel);
  setTimeout(function(){ input.focus(); }, 0);
  return form;
}

function renderContentList(leafId){
  var itemsWrap = $('#list-items');
  itemsWrap.innerHTML = '';
  var items = childrenOf(leafId).filter(function(n){ return n.kind==='content'; });

  var mcConfig = listState.branch === 'training' ? { field:'methodCategories', list:TRAINING_CATEGORIES }
    : listState.branch === 'treatment' ? { field:'treatmentCategories', list:TREATMENT_CATEGORIES }
    : null;

  if(mcConfig){
    var filterRow = el('div','mc-filter-row');
    mcConfig.list.forEach(function(mc){
      var btn = el('button','mc-pill' + (listMethodFilter.indexOf(mc.key)!==-1 ? ' active' : ''));
      btn.type = 'button';
      btn.textContent = mc.label;
      btn.addEventListener('click', function(key){
        return function(){
          var idx = listMethodFilter.indexOf(key);
          if(idx===-1) listMethodFilter.push(key); else listMethodFilter.splice(idx,1);
          renderContentList(leafId);
        };
      }(mc.key));
      filterRow.appendChild(btn);
    });
    if(listMethodFilter.length){
      var clearBtn = el('button','mc-filter-clear');
      clearBtn.type = 'button';
      clearBtn.textContent = '✕ 絞り込み解除';
      clearBtn.addEventListener('click', function(){ listMethodFilter = []; renderContentList(leafId); });
      filterRow.appendChild(clearBtn);
    }
    itemsWrap.appendChild(filterRow);

    if(listMethodFilter.length){
      items = items.filter(function(n){
        var cats = Array.isArray(n[mcConfig.field]) ? n[mcConfig.field] : [];
        return listMethodFilter.every(function(k){ return cats.indexOf(k) !== -1; });
      });
    }
  }

  if(!items.length){
    var hint = el('div','list-empty-hint');
    hint.textContent = editMode ? 'まだ項目がありません。下のボタンから追加してください。' : 'まだ項目がありません。';
    itemsWrap.appendChild(hint);
  }

  items.forEach(function(n){
    var meta = TYPE_META[n.type]||TYPE_META.note;

        if(ref){ openPanel(ref.id); }
        renderContentList(leafId);
      },
      function(){ listContentCreating = null; renderContentList(leafId); }
    ));
  }
}
